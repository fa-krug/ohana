# Leuchtfeuer configuration, generated by `leuchtfeuer init` (CLI main, catalog 2026.11.7).
# Schema: https://raw.githubusercontent.com/SaschaKrug/Leuchtfeuer/main/contracts/leuchtfeuer-config.schema.json
# Quality gates, thresholds and severities live on the server; this file only says what to
# scan and where reports are. Check it with `leuchtfeuer doctor`.
version: 1

# Server URL. The CI/CD variable LEUCHTFEUER_URL overrides it; the token always comes from
# LEUCHTFEUER_TOKEN (never put it into this file).
# server: https://leuchtfeuer.example.com

# Detected stack: css (1), dockerfile (2), javascript (5), python (1), shell (2), swift (310), typescript (455)
# Markers: docs/package.json, relay/Dockerfile, relay/package.json, relay/tsconfig.json, server/Dockerfile, server/package.json, server/tsconfig.json
# Tools not listed here follow the server's measurement profile. Uncomment to override.
# tools:
#   bandit:        {enabled: true }  # Bandit 1.9.4, sast (default)
#   biome:         {enabled: false}  # Biome 2.6.7, lint (optional)
#   checkov:       {enabled: true }  # Checkov 3.4.5, iac (default)
#   eslint:        {enabled: true }  # ESLint 10.14.0, lint (default)
#   gitleaks:      {enabled: true }  # Gitleaks 8.30.1, secrets (default)
#   grype:         {enabled: true }  # Grype 0.121.3, sca (default)
#   hadolint:      {enabled: true }  # Hadolint 2.14.0, iac (default)
#   jscpd:         {enabled: true }  # jscpd 5.4.3, complexity (default)
#   lizard:        {enabled: true }  # lizard 1.26.0, complexity (default)
#   mobsfscan:     {enabled: true }  # mobsfscan 1.1.0, sast (default)
#   mypy:          {enabled: true }  # mypy 2.4.1, typecheck (default)
#   opengrep:      {enabled: true }  # Opengrep 1.33.1, sast (default)
#   osv-scanner:   {enabled: false}  # OSV-Scanner 2.7.1, sca (optional)
#   pyright:       {enabled: false}  # Pyright 1.1.414, typecheck (optional)
#   ruff:          {enabled: true }  # Ruff 0.17.5, lint (default)
#   shellcheck:    {enabled: true }  # ShellCheck 0.11.0, iac (default)
#   stylelint:     {enabled: false}  # Stylelint 18.0.0, lint (optional)
#   swiftlint:     {enabled: true }  # SwiftLint 0.65.1, lint (default)
#   syft:          {enabled: true }  # Syft 1.57.1, license (default)
#   tsc:           {enabled: true }  # TypeScript (tsc --noEmit) 7.0.2, typecheck (default)
#   ruff:
#     args: ["--select", "E,F,S"]   # appended to the pinned command line
#     config: pyproject.toml           # tool config file inside the repository
#     paths: [src]                     # limit the tool to these paths

paths:
  include: ["."]
  # Excluded from every tool and from the upload (doublestar globs).
  exclude: []

# Repository-level suppressions. A reason is mandatory; every suppression is visible in the
# finding list and the audit log. Inline alternative on (or above) the flagged line:
#   # leuchtfeuer:ignore ruff:S101 asserts are fine in tests
ignore:
  # The German translation files are label tables ("API-Tokens", "SMTP-Passwort", "Client-Secret"
  # are the German texts for those field labels). JSON takes no comment, so the reason lives here:
  # the flagged strings are UI wording, never a credential.
  - rule: "checkov:CKV_SECRET_6"
    paths: ["apple/Localization/*.de.json"]
    reason: German UI label translations that only look like base64; no credential in them

# Test and coverage reports produced by earlier CI jobs (uploaded as raw files).
# reports:
#   junit: ["reports/junit*.xml"]
#   coverage:
#     - {format: cobertura, path: coverage.xml}

# SARIF 2.1.0 files from tools outside the catalog.
# sarif_import:
#   - {tool: my-scanner, path: build/my-scanner.sarif, category: sast}

secrets:
  # Scan the full Git history (useful once on onboarding). Default: only the MR diff.
  full_history: false

sbom:
  # Upload a CycloneDX SBOM of the source tree on default-branch scans.
  enabled: true

wait:
  # How long `leuchtfeuer run` waits for the quality gate (0 = do not wait).
  timeout_seconds: 300
