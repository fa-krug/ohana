name: Ohana

options:
  bundleIdPrefix: de.fa-krug
  # Runs from iOS 26 / macOS 26 (the first releases with Liquid Glass), built with the newest
  # SDKs: APIs newer than 26 need `if #available(iOS 27, macOS 27, *)`.
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - de
    - Base

settings:
  base:
    SWIFT_VERSION: "6"
    # Approachable concurrency: code is on the main actor unless it says otherwise.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # The version people see; the build number must grow with every upload to App Store
    # Connect (README: Releasing). Both reach the apps' Info.plists as $(…).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HS26J3YA63
    VERSIONING_SYSTEM: apple-generic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Only the test bundles; the apps have their own Info.plists (`info:` below).
    GENERATE_INFOPLIST_FILE: true
  configs:
    Release:
      ENABLE_TESTABILITY: false

targets:
  # iOS / iPadOS. Named plainly "Ohana" like yana-ios's "Yana"; the Mac build is its own
  # native target (Ohana-macOS) over the same sources, not Catalyst.
  Ohana:
    type: application
    platform: iOS
    sources:
      - path: Ohana
        excludes:
          - "Info-*.plist"
    info:
      path: Ohana/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS and the Keychain: no export compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: "Ohana uses your photos for recipe pictures."
        NSCameraUsageDescription: "Ohana uses the camera for recipe pictures."
        NSMicrophoneUsageDescription: "Ohana listens when you dictate a message to the assistant."
        NSSpeechRecognitionUsageDescription: "Ohana turns what you dictate to the assistant into text."
        CFBundleURLTypes:
          - CFBundleURLName: de.fa-krug.Ohana.pairing
            CFBundleURLSchemes: [ohana]
        OhanaAppGroup: $(OHANA_APP_GROUP)
    dependencies:
      - target: OhanaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Ohana/Entitlements/Ohana-iOS.entitlements
        OHANA_APP_GROUP: group.de.fa-krug.Ohana
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  Ohana-macOS:
    type: application
    platform: macOS
    sources:
      - path: Ohana
        excludes:
          - "Info-*.plist"
    info:
      path: Ohana/Info-macOS.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Sascha Krug. All rights reserved."
        LSApplicationCategoryType: public.app-category.lifestyle
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: de.fa-krug.Ohana.pairing
            CFBundleURLSchemes: [ohana]
        OhanaAppGroup: $(OHANA_APP_GROUP)
    dependencies:
      - target: OhanaWidgets-macOS
    settings:
      base:
        # Both targets build "Ohana.app" with one bundle id, so the Keychain item is shared.
        PRODUCT_NAME: Ohana
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Ohana/Entitlements/Ohana-macOS.entitlements
        # The Mac's App Groups are team-prefixed (a "group." one asks the user for access).
        OHANA_APP_GROUP: $(TeamIdentifierPrefix)de.fa-krug.Ohana
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The widgets (OhanaWidgets/), one extension per platform over the same sources, embedded in
  # the app. They share a few of the app's files: the widget data (Core/Widgets), the Keychain,
  # Day, the colors and the strings.
  OhanaWidgets:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: OhanaWidgets
        excludes:
          - "Info-*.plist"
          - "Entitlements"
      - path: Ohana/Core/Widgets
      - path: Ohana/Core/Auth/Keychain.swift
      - path: Ohana/Core/Support/Day.swift
      - path: Ohana/DesignSystem/Tints.swift
      - path: Ohana/Resources/Localizable.xcstrings
    info:
      path: OhanaWidgets/Info-iOS.plist
      properties: &widgetInfo
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        OhanaAppGroup: $(OHANA_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.Widgets
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: OhanaWidgets/Entitlements/OhanaWidgets-iOS.entitlements
        OHANA_APP_GROUP: group.de.fa-krug.Ohana
        TARGETED_DEVICE_FAMILY: "1,2"
        # WidgetKit's providers aren't on the main actor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES

  OhanaWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    info:
      path: OhanaWidgets/Info-macOS.plist
      properties: *widgetInfo
    settings:
      base:
        PRODUCT_NAME: OhanaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.Widgets
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: OhanaWidgets/Entitlements/OhanaWidgets-macOS.entitlements
        OHANA_APP_GROUP: $(TeamIdentifierPrefix)de.fa-krug.Ohana
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES

  OhanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OhanaTests
    dependencies:
      - target: Ohana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ohana.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ohana"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OhanaTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OhanaTests
    dependencies:
      - target: Ohana-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.tests.macos
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ohana.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ohana"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Ohana:
    build:
      targets:
        Ohana: all
    run:
      config: Debug
    test:
      config: Debug
      # The tests compare English strings; the catalog would give German on a German Mac.
      language: en
      region: US
      targets:
        - OhanaTests
    archive:
      config: Release

  Ohana-macOS:
    build:
      targets:
        Ohana-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      # The tests compare English strings; the catalog would give German on a German Mac.
      language: en
      region: US
      targets:
        - OhanaTests-macOS
    archive:
      config: Release
