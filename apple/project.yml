name: Ohana

options:
  bundleIdPrefix: de.fa-krug
  # Runs from iOS 26 / macOS 26 (the first releases with Liquid Glass), built with the newest
  # SDKs: APIs newer than 26 need `if #available(iOS 27, macOS 27, *)`.
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - de
    - Base

settings:
  base:
    SWIFT_VERSION: "6"
    # Approachable concurrency: code is on the main actor unless it says otherwise.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # The version people see; the build number must grow with every upload to App Store
    # Connect (README: Releasing). Both reach the apps' Info.plists as $(…).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HS26J3YA63
    VERSIONING_SYSTEM: apple-generic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Only the test bundles; the apps have their own Info.plists (`info:` below).
    GENERATE_INFOPLIST_FILE: true
  configs:
    Release:
      ENABLE_TESTABILITY: false

targets:
  # iOS / iPadOS. Named plainly "Ohana" like yana-ios's "Yana"; the Mac build is its own
  # native target (Ohana-macOS) over the same sources, not Catalyst.
  Ohana:
    type: application
    platform: iOS
    sources:
      - path: Ohana
        excludes:
          - "Info-*.plist"
      # Code the app shares with its extensions: the share extension (Keychain, SharedConnection)
      # and the widget extension (the cook timers' Live Activity).
      - path: Shared
    dependencies:
      - target: OhanaShare
      - target: OhanaWidgets
    info:
      path: Ohana/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS and the Keychain: no export compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: "Ohana uses your photos for recipe pictures."
        NSCameraUsageDescription: "Ohana uses the camera for recipe pictures."
        NSMicrophoneUsageDescription: "Ohana listens when you dictate a message to the assistant."
        NSSpeechRecognitionUsageDescription: "Ohana turns what you dictate to the assistant into text."
        # The cook view's timers on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: de.fa-krug.Ohana.pairing
            CFBundleURLSchemes: [ohana]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Ohana/Entitlements/Ohana-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The widget extension, embedded in the iOS app: the cook timers' Live Activity.
  OhanaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OhanaWidgets
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: OhanaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.Widgets
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  Ohana-macOS:
    type: application
    platform: macOS
    sources:
      - path: Ohana
        excludes:
          - "Info-*.plist"
      - path: Shared
        excludes:
          # The cook timers' Live Activity: the iOS app and its widgets only.
          - "CookTimerAttributes.swift"
    dependencies:
      - target: OhanaShare-macOS
    info:
      path: Ohana/Info-macOS.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Sascha Krug. All rights reserved."
        LSApplicationCategoryType: public.app-category.lifestyle
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: de.fa-krug.Ohana.pairing
            CFBundleURLSchemes: [ohana]
    settings:
      base:
        # Both targets build "Ohana.app" with one bundle id, so the Keychain item is shared.
        PRODUCT_NAME: Ohana
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Ohana/Entitlements/Ohana-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # "Save to Ohana" in the share sheet (Safari and other apps sharing a web page): the server's
  # assistant imports the page's recipe. Embedded in the apps; reads the app's connection from the
  # Keychain (same access group, no App Group: Shared/SharedConnection.swift). One bundle id for
  # both platforms, like the apps.
  OhanaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info-*.plist"
      - path: Shared
        excludes:
          # The cook timers' Live Activity: the iOS app and its widgets only.
          - "CookTimerAttributes.swift"
      # The app's strings (the extension's are among them).
      - path: Ohana/Resources/Localizable.xcstrings
    info:
      path: ShareExtension/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: OhanaShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
            # Safari runs it in the page first: title, text (JSON-LD + visible text), og:image.
            NSExtensionJavaScriptPreprocessingFile: Preprocess
    settings:
      base:
        PRODUCT_NAME: OhanaShare
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.Share
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ShareExtension/OhanaShare-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

  OhanaShare-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info-*.plist"
          # Safari on the Mac doesn't run a preprocessing script: the server fetches the page.
          - "Preprocess.js"
      - path: Shared
        excludes:
          # The cook timers' Live Activity: the iOS app and its widgets only.
          - "CookTimerAttributes.swift"
      - path: Ohana/Resources/Localizable.xcstrings
    info:
      path: ShareExtension/Info-macOS.plist
      properties:
        CFBundleDisplayName: Ohana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: OhanaShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: OhanaShare
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.Share
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ShareExtension/OhanaShare-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  OhanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OhanaTests
    dependencies:
      - target: Ohana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ohana.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ohana"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OhanaTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OhanaTests
    dependencies:
      - target: Ohana-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Ohana.tests.macos
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ohana.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ohana"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Ohana:
    build:
      targets:
        Ohana: all
    run:
      config: Debug
    test:
      config: Debug
      # The tests compare English strings; the catalog would give German on a German Mac.
      language: en
      region: US
      targets:
        - OhanaTests
    archive:
      config: Release

  Ohana-macOS:
    build:
      targets:
        Ohana-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      # The tests compare English strings; the catalog would give German on a German Mac.
      language: en
      region: US
      targets:
        - OhanaTests-macOS
    archive:
      config: Release
