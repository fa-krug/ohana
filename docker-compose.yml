# Self-hosting Ohana: copy this file and .env.example (as .env) to your server, fill in .env,
# then `docker compose up -d`. Put a reverse proxy with HTTPS in front of port 8000 (passkeys
# need HTTPS); see docs/self-hosting.md. Two containers, one image, one data volume:
#   ohana         the API and the sign-in pages; applies the database migrations at start
#   ohana-worker  background jobs: assistant turns, appointment searches, notifications, backups
# To build the image from this checkout instead, replace `image:` with `build: ./server`.

x-ohana: &ohana
  image: ghcr.io/fa-krug/ohana:${OHANA_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ:-Europe/Berlin}
  volumes:
    - ohana-data:/app/data

services:
  ohana:
    <<: *ohana
    container_name: ohana
    command: ["server"]
    ports:
      - "${OHANA_PORT:-8000}:8000"

  ohana-worker:
    <<: *ohana
    container_name: ohana-worker
    command: ["worker"]
    depends_on:
      ohana:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  # /app/data: the SQLite database, media/ (recipe photos) and backups/.
  ohana-data:
