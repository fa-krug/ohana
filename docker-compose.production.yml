# docker-compose.production.yml: fa-krug's own server (Arcane on a Raspberry Pi), redeployed by CI
# from ghcr.io/fa-krug/ohana:main. Self-hosters: see docker-compose.yml and docs/self-hosting.md.
# web and worker share one image and one data volume (SQLite in WAL mode).
x-env: &env
  NODE_ENV: production
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  # Optional: a separate key for secrets at rest (else derived from AUTH_SECRET).
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  APP_URL: https://${OHANA_DOMAIN:-ohana.fa-krug.de}
  # Passkeys: the domain and origin come from APP_URL.
  WEBAUTHN_RP_NAME: Ohana
  BACKUP_KEEP: ${BACKUP_KEEP:-14}
  # Optional: allow the family's AI endpoint on the home network (e.g. Ollama).
  AI_ALLOW_PRIVATE_ENDPOINT: ${AI_ALLOW_PRIVATE_ENDPOINT:-}
  TZ: ${TZ:-Europe/Berlin}
  # DATABASE_FILE=/app/data/ohana.db, BACKUP_DIR=/app/data/backups and
  # MEDIA_ROOT=/app/data/media (recipe images) are image defaults, all in the ohana-data volume.

services:
  web:
    image: ghcr.io/fa-krug/ohana:main
    container_name: ohana
    command: ["server"]
    restart: always
    expose:
      - "8000"
    environment:
      <<: *env
      PORT: "8000"
    volumes:
      - ohana-data:/app/data
    networks:
      - gitops_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohana.rule=Host(`${OHANA_DOMAIN:-ohana.fa-krug.de}`)"
      - "traefik.http.routers.ohana.entrypoints=web"
      - "traefik.http.services.ohana.loadbalancer.server.port=8000"

  worker:
    image: ghcr.io/fa-krug/ohana:main
    container_name: ohana-worker
    command: ["worker"]
    restart: always
    environment: *env
    volumes:
      - ohana-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

networks:
  gitops_default:
    external: true

volumes:
  ohana-data:
