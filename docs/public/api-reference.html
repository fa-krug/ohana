<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse API reference</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f6f7f9;
      }
      .frame {
        max-width: 1400px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div id="redoc-container"></div>
    </div>
    <script type="module">
      // Redoc 3 ships its standalone bundle as an ES module, so the UMD
      // `window.Redoc.init` global the 2.x page relied on is gone; the bundle
      // is copied into the site by the docs build (see .vitepress/config.mts)
      // and imported from there so the page stays self-contained.
      import { init } from '/assets/redoc.standalone.js';

      init(
        '/openapi.json',
        {
          // The spec is served by the API itself; the docs site only renders it.
          specUrl: '/openapi.json',
          options: {
            // Redoc 3 renamed these options and removed the ones that no longer apply.
            hideOneOfDescription: true,
            hideDownloadButton: false,
            pathInMiddlePanel: false,
            unIndentedSchemaExamples: true,
            theme: {
              // Redoc 3 draws this mark itself when the spec has no logo, and it
              // points at redoc.ly, so the logo is set here instead.
              logo: {
                url: '/logo.svg',
                altText: 'Pulse',
              },
              apiLogo: {
                src: '/logo.svg',
                altText: 'Pulse',
                href: '/',
              },
              sidebar: {
                backgroundColor: '#f6f7f9',
                width: '320px',
              },
              color: {
                primary: { main: '#2f6fed' },
              },
              typography: {
                headings: { fontFamily: 'ui-sans-serif, system-ui, sans-serif' },
              },
            },
          },
        },
        document.getElementById('redoc-container'),
      );
    </script>
  </body>
</html>
