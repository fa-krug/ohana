<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API reference · Ohana</title>
  <meta name="description" content="The JSON API of a self-hosted Ohana server (OpenAPI 3.1).">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="theme-color" content="#0d9488">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; }
    .bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid #e2e2e3; font-size: 14px; }
    .bar a { color: #0f766e; text-decoration: none; font-weight: 500; }
    .bar a:hover { text-decoration: underline; }
    .bar .home { display: flex; align-items: center; gap: 8px; color: #1f2937; font-weight: 600; font-size: 16px; }
    .bar img { width: 24px; height: 24px; border-radius: 22%; }
    .bar .spacer { flex: 1; }
    .bar .legal { color: #6b7280; font-weight: 400; }
  </style>
</head>
<body>
  <nav class="bar">
    <a class="home" href="/"><img src="/icon.svg" alt="">Ohana</a>
    <a href="/api">API guide</a>
    <a href="/openapi.yaml" download>openapi.yaml</a>
    <span class="spacer"></span>
    <a class="legal" href="/legal/imprint">Imprint</a>
    <a class="legal" href="/legal/privacy">Privacy</a>
  </nav>
  <div id="redoc"></div>
  <!-- Redoc 3 themes with CSS variables (its 2.x `theme` option is gone). Redoc's own defaults sit
       on :root and :root.dark and arrive with a stylesheet of their own, so this says the same two
       selectors, hung off html to stay the stronger one. -->
  <style>
    html:root, html:root.dark {
      --color-primary-base: #0f766e;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --sidebar-width: 280px;
    }
  </style>
  <!-- Redoc (MIT), served from this site: no third-party requests. Redoc 3 ships an ES module and
       no global `Redoc`, and its anonymous usage telemetry (otel.cloud.redocly.com) is on by
       default: turned off here, so the page asks nothing of anyone else (see legal/privacy.md). -->
  <script type="module">
    import { init } from "/redoc.standalone.js";

    init(
      "/openapi.yaml",
      {
        hideDownloadButtons: true,
        disableTelemetry: true,
      },
      document.getElementById("redoc"),
    );
  </script>
</body>
</html>
