<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API reference · Ohana</title>
  <meta name="description" content="The JSON API of a self-hosted Ohana server (OpenAPI 3.1).">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="theme-color" content="#0d9488">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; }
    .bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid #e2e2e3; font-size: 14px; }
    .bar a { color: #0f766e; text-decoration: none; font-weight: 500; }
    .bar a:hover { text-decoration: underline; }
    .bar .home { display: flex; align-items: center; gap: 8px; color: #1f2937; font-weight: 600; font-size: 16px; }
    .bar img { width: 24px; height: 24px; border-radius: 22%; }
    .bar .spacer { flex: 1; }
    .bar .legal { color: #6b7280; font-weight: 400; }
  </style>
</head>
<body>
  <nav class="bar">
    <a class="home" href="/"><img src="/icon.svg" alt="">Ohana</a>
    <a href="/api">API guide</a>
    <a href="/openapi.yaml" download>openapi.yaml</a>
    <span class="spacer"></span>
    <a class="legal" href="/legal/imprint">Imprint</a>
    <a class="legal" href="/legal/privacy">Privacy</a>
  </nav>
  <div id="redoc"></div>
  <!-- Redoc (MIT), served from this site: no third-party requests. -->
  <script>
    // Redoc 3 is an ES module and has no window.Redoc any more, so the bundle is loaded with a
    // dynamic import and kept out of the way of browsers without JavaScript support.
    import('/redoc.standalone.js')
      .then(({ init }) => {
        init(
          '/openapi.yaml',
          {
            // Redoc 3 renamed this option (it always covered every download it offers).
            hideDownloadButtons: true,
            expandResponses: '200,201',
            // Redoc 3 sends anonymous usage data to Redocly unless it is turned off (§ 25 TDDDG).
            disableTelemetry: true,
            theme: {
              colors: { primary: { main: '#0f766e' } },
              typography: { fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif', headings: { fontFamily: 'inherit' } },
              sidebar: { width: '280px' },
            },
          },
          document.getElementById('redoc'),
        )
      })
      .catch((error) => {
        document.getElementById('redoc').textContent = `The API reference could not be loaded: ${error.message}`
      })
  </script>
</body>
</html>
