          application/json:
            schema: {$ref: "#/components/schemas/SearchInput"}
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IdObject"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Appointments]
      operationId: deleteSearch
      summary: Delete a search with its runs
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/searches/{searchId}/runs:
    get:
      tags: [Appointments]
      operationId: listRuns
      summary: The search's runs (newest first) with the doctors each found
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/SearchId"
      responses:
        "200":
          description: The runs (kept 30 days).
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/RunWithResults"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/searches/{searchId}/run:
    post:
      tags: [Appointments]
      operationId: runSearchNow
      summary: Run now (the worker picks it up within seconds)
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/SearchId"
      responses:
        "200":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: {type: string, description: "The search id."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/searches/{searchId}/enabled:
    post:
      tags: [Appointments]
      operationId: setSearchEnabled
      summary: Turn a search on or off
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/SearchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: The search's state.
          content:
            application/json:
              schema:
                type: object
                required: [id, enabled]
                properties:
                  id: {type: string}
                  enabled: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/searches/{searchId}/slots/{resultId}:
    get:
      tags: [Appointments]
      operationId: getSlot
      summary: A found slot with its practice, booking state and the people to book for
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/SearchId"
        - $ref: "#/components/parameters/ResultId"
      responses:
        "200":
          description: The slot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SlotDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/searches/{searchId}/slots/{resultId}/book:
    post:
      tags: [Appointments]
      operationId: bookSlot
      summary: Mark a slot as booked (a calendar event; once per slot)
      description: >-
        The booking itself happens on Doctolib / jameda; this records it as a timed event with
        the slot's details. `stopSearch` turns the search off. 409 if the slot is booked already.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/SearchId"
        - $ref: "#/components/parameters/ResultId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookingInput"}
      responses:
        "201":
          description: The event.
          content:
            application/json:
              schema:
                type: object
                required: [eventId, event]
                properties:
                  eventId: {type: string}
                  event: {$ref: "#/components/schemas/Event"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/families/{familyId}/appointments/results/{resultId}/ignore:
    post:
      tags: [Appointments]
      operationId: ignoreResult
      summary: Ignore a result's doctor and visit reason for its search from now on
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ResultId"
      responses:
        "200":
          description: The result's search.
          content:
            application/json:
              schema:
                type: object
                required: [searchId]
                properties:
                  searchId: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/ignored/{entryId}:
    delete:
      tags: [Appointments]
      operationId: unignore
      summary: Stop ignoring a doctor / visit reason
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - name: entryId
          in: path
          required: true
          description: An `ignored[].id` of the search.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/bookings/{eventId}:
    delete:
      tags: [Appointments]
      operationId: removeBooking
      summary: Remove a booking (its calendar event)
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: eventId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/doctolib-specialities:
    get:
      tags: [Appointments]
      operationId: doctolibSpecialities
      summary: Doctolib speciality autocomplete (proxied; `{message}` errors)
      description: An empty query or a Doctolib failure answers `[]`.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/AutocompleteQuery"
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [slug, label]
                  properties:
                    slug: {type: string, description: "`specialitySlug` of a search."}
                    label: {type: string}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "404": {$ref: "#/components/responses/MessageNotFound"}
  /api/v1/families/{familyId}/appointments/jameda-terms:
    get:
      tags: [Appointments]
      operationId: jamedaTerms
      summary: jameda term autocomplete (from a bundled list; `{message}` errors)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/AutocompleteQuery"
      responses:
        "200":
          description: Up to 20 terms.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/JamedaTerm"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "404": {$ref: "#/components/responses/MessageNotFound"}
  /api/v1/families/{familyId}/geocode:
    get:
      tags: [Household]
      operationId: geocode
      summary: Place autocomplete via Photon (search locations, home address; `{message}` errors)
      description: An empty query or a Photon failure answers `[]`. At most 5 suggestions.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/AutocompleteQuery"
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LocationSuggestion"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "404": {$ref: "#/components/responses/MessageNotFound"}

  # ------------------------------------------------------------------ assistant
  /api/v1/families/{familyId}/agent:
    get:
      tags: [Assistant]
      operationId: getAgentInstructions
      summary: Instructions for AI agents using this API (Markdown)
      description: >-
        How an outside agent uses the API with the user's token: the family's entry types and
        ready-to-use URLs. Read-only hints for viewers.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: The instructions.
          content:
            text/markdown:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/settings:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [AI settings]
      operationId: getAiSettings
      summary: The family's AI settings (keys never returned)
      description: Viewers see only whether the assistant is set up and the model.
      x-ohana-role: viewer
      responses:
        "200": {$ref: "#/components/responses/AiSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [AI settings]
      operationId: putAiSettings
      summary: Change the AI settings (only the fields given)
      description: >-
        `baseUrl` is an OpenAI-compatible API (private addresses only when the server allows
        them). Keys are stored encrypted; `apiKey: ""` removes the key.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiSettingsInput"}
      responses:
        "200": {$ref: "#/components/responses/AiSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/models:
    post:
      tags: [AI settings]
      operationId: listAiModels
      summary: The endpoint's models (may try an unsaved URL / key)
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl: {type: string}
                apiKey: {type: string}
      responses:
        "200":
          description: Model ids, sorted.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/v1/families/{familyId}/ai/test:
    post:
      tags: [AI settings]
      operationId: testAi
      summary: One short completion with the saved settings
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: The model answered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, model, reply]
                properties:
                  ok: {type: boolean, const: true}
                  model: {type: string}
                  reply: {type: string, maxLength: 200}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/v1/families/{familyId}/ai/categorize:
    post:
      tags: [AI settings]
      operationId: categorizeTransactions
      summary: Sort uncategorized transactions into categories
      description: >-
        Takes the given `ids`, or the uncategorized transactions in the range after the first
        `skip` (at most 200 per request; `remaining` says how many are left). First like
        similar earlier transactions (`matched`, no AI needed), then by the model (which may
        search the web). Without AI settings only the first step runs (`ai: false`).
        `inverse` are ops for `POST …/finance/transactions` that undo it. Under `/ai`, so it
        answers 404 when the server turned the `assistant` module off (even the similarity step).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: {type: string, format: uuid}
                from: {type: string, format: date}
                to: {type: string, format: date}
                skip: {type: integer, minimum: 0, default: 0}
                lang: {type: string, enum: [en, de], default: en}
      responses:
        "200":
          description: What was sorted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CategorizeResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Assistant]
      operationId: listChats
      summary: The caller's chats in the family (newest first)
      description: Chats are personal; at most 100 per user and family are kept.
      x-ohana-role: viewer
      responses:
        "200":
          description: The chats.
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    type: array
                    items: {$ref: "#/components/schemas/Chat"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Assistant]
      operationId: startChat
      summary: Start a chat with its first message (streams the answer)
      description: >-
        Saves the message and hands the turn to the worker, then streams the chat like
        `GET …/events`. Viewers chat too, with the tools that only read. 400 when the AI isn't
        set up.
      x-ohana-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatMessageInput"}
      responses:
        "200": {$ref: "#/components/responses/ChatStream"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/import:
    post:
      tags: [Assistant]
      operationId: importChat
      summary: Import a chat kept elsewhere (family-planner's device chats)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                title: {type: string}
                updatedAt: {type: number, description: "Milliseconds since 1970."}
                items:
                  type: array
                  description: What the chat shows (unknown kinds are dropped; the newest 1000 are kept).
                  items: {$ref: "#/components/schemas/ChatItem"}
                history:
                  type: array
                  description: OpenAI-style chat messages for the model (the newest 400 are kept).
                  items: {type: object, additionalProperties: true}
      responses:
        "201":
          description: The imported chat.
          content:
            application/json:
              schema:
                type: object
                required: [chat]
                properties:
                  chat: {$ref: "#/components/schemas/Chat"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/{chatId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [Assistant]
      operationId: getChat
      summary: A chat with its items
      x-ohana-role: viewer
      responses:
        "200":
          description: The chat; `rev` is the revision to follow from (`GET …/events?since=rev`).
          content:
            application/json:
              schema:
                type: object
                required: [chat, rev, items]
                properties:
                  chat: {$ref: "#/components/schemas/Chat"}
                  rev: {type: integer}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ChatItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Assistant]
      operationId: deleteChat
      summary: Delete a chat (a running turn ends)
      x-ohana-role: viewer
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/events:
    get:
      tags: [Assistant]
      operationId: followChat
      summary: Follow a chat (Server-Sent Events)
      description: >-
        Streams the items changed since revision `since`, the chat's summary when it changes,
        and ends with `end` once no turn runs and nothing waits, or with `reconnect` after
        about 100 s (ask again with the last `rev`). See `ChatStream`.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
        - name: since
          in: query
          schema: {type: integer, default: 0}
      responses:
        "200": {$ref: "#/components/responses/ChatStream"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/messages:
    post:
      tags: [Assistant]
      operationId: sendChatMessage
      summary: Send a message while no turn runs (streams the answer)
      description: 409 while the assistant still answers (use `…/queue` then).
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatMessageInput"}
      responses:
        "200": {$ref: "#/components/responses/ChatStream"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/queue:
    post:
      tags: [Assistant]
      operationId: queueChatMessage
      summary: Queue a message while a turn runs (it goes next, or now if none runs)
      description: At most 10 messages wait. Follow the chat to see the turn.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatMessageInput"}
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [chat, id]
                properties:
                  chat: {$ref: "#/components/schemas/Chat"}
                  id: {type: string, description: "The queued message's id (for `…/unqueue`)."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/unqueue:
    post:
      tags: [Assistant]
      operationId: unqueueChatMessage
      summary: Take back a waiting message (unless its turn started)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
      responses:
        "200": {$ref: "#/components/responses/ChatSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/answer:
    post:
      tags: [Assistant]
      operationId: answerChatQuestion
      summary: Answer the assistant's waiting question (streams the rest of the turn)
      description: >-
        `id` is the question item's id; `selected` are picked options (only the question's own
        count), `text` an own answer. 409 when the question doesn't wait any more.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ChatContextInput"
                - type: object
                  required: [id]
                  properties:
                    id: {type: string}
                    selected:
                      type: array
                      maxItems: 8
                      items: {type: string}
                    text: {type: string, maxLength: 20000}
      responses:
        "200": {$ref: "#/components/responses/ChatStream"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/stop:
    post:
      tags: [Assistant]
      operationId: stopChat
      summary: Stop the running turn (it ends with what it did so far)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200": {$ref: "#/components/responses/ChatSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/undone:
    post:
      tags: [Assistant]
      operationId: markChangeUndone
      summary: Tell the chat that one of its changes was undone
      description: >-
        After the client replayed a change item's `undo` steps: marks the item `undone` and
        the model hears about it in the next turn.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string, description: "The change item's id."}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/ai/chats/{chatId}/page:
    post:
      tags: [Assistant]
      operationId: moveChat
      summary: Move the chat to another page (its next turn is about that page)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page]
              properties:
                page: {$ref: "#/components/schemas/ChatPage"}
      responses:
        "200": {$ref: "#/components/responses/ChatSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        An API token: `Authorization: Bearer <token>`. Created by pairing the app
        (`/device/pair`) or with `POST /api/v1/me/tokens`; the server stores only its hash.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ohana_session
      description: >-
        The session cookie of the server's sign-in pages (family routes only). Requests that
        change something must come from the server's own origin.

  parameters:
    FamilyId:
      name: familyId
      in: path
      required: true
      description: The family's id (a UUID, or a 20-character id from before the import).
      schema: {type: string, pattern: "^[A-Za-z0-9-]{10,64}$"}
    InviteCode:
      name: code
      in: path
      required: true
      description: The code at the end of an invite link (`…/invite/{code}`).
      schema: {type: string}
    RangeYear:
      name: year
      in: query
      description: A whole year (YYYY); wins over `from`/`to`.
      schema: {type: string, pattern: "^\\d{4}$"}
    RangeFrom:
      name: from
      in: query
      description: First day (inclusive); open without.
      schema: {type: string, format: date}
    RangeTo:
      name: to
      in: query
      description: Last day (inclusive); open without.
      schema: {type: string, format: date}
    TypeYear:
      name: year
      in: query
      description: The types' year (YYYY); default the body's `year`, else the current year.
      schema: {type: string, pattern: "^\\d{4}$"}
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: {type: string}
    RecipeList:
      name: list
      in: query
      description: Only recipes of this list.
      schema: {$ref: "#/components/schemas/RecipeListType"}
    RecipeQuery:
      name: q
      in: query
      description: Search text (ranked by relevance).
      schema: {type: string}
    RecipeSort:
      name: sort
      in: query
      description: Order when not searching (unknown values sort by name).
      schema: {type: string, enum: [name-asc, name-desc, newest, updated], default: name-asc}
    RecipeTags:
      name: tags
      in: query
      description: Comma-separated tag ids; recipes with any of them.
      schema: {type: string}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    RecipeLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ListId:
      name: listId
      in: path
      required: true
      schema: {type: string}
    ShoppingLang:
      name: lang
      in: query
      description: Language of the ingredient names (default from `Accept-Language`, else en).
      schema: {type: string, enum: [en, de]}
    SearchId:
      name: searchId
      in: path
      required: true
      schema: {type: string}
    ResultId:
      name: resultId
      in: path
      required: true
      description: A result (slot) id, `DoctorSlot.resultId`.
      schema: {type: integer, minimum: 1}
    AutocompleteQuery:
      name: q
      in: query
      description: What the user typed.
      schema: {type: string}
    ChatId:
      name: chatId
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    Ok:
      description: Done.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Ok"}
    BadRequest:
      description: Invalid input (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Not signed in, or the token is unknown or expired (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        A viewer asked for a change ("You can only view this family"), a cross-origin cookie
        write, or an account that must set its password first (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: >-
        No such thing, not a member of the family, a disabled module, or (admin routes) not an
        administrator (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: A conflict (already exists, already booked, still answering) (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: Too many failed password checks; try again in a few minutes (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadGateway:
      description: An outside service (AI endpoint, notification provider) failed (`{error}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MessageBadRequest:
      description: Invalid input (`{message}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Message"}
    MessageUnauthorized:
      description: Not signed in (`{message}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Message"}
    MessageForbidden:
      description: Only editors can do this (`{message}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Message"}
    MessageNotFound:
      description: Not found, not a member, or a disabled module (`{message}`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Message"}
    PasskeyList:
      description: The account's passkeys.
      content:
        application/json:
          schema:
            type: object
            required: [passkeys]
            properties:
              passkeys:
                type: array
                items: {$ref: "#/components/schemas/Passkey"}
    FamilyState:
      description: The family and its calendar.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FamilyState"}
    OpsResult:
      description: Applied.
      content:
        application/json:
          schema:
            type: object
            required: [ok, ops, days]
            properties:
              ok: {type: boolean, const: true}
              ops: {type: integer, description: "Ops applied."}
              days: {type: integer, description: "Days they touched."}
    DeletedString:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: {type: string, description: "The deleted thing's id."}
    FinanceOverview:
      description: Settings, categories and accounts.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FinanceOverview"}
    IngredientsAndUnits:
      description: Ingredients and units.
      content:
        application/json:
          schema:
            type: object
            required: [ingredients, units]
            properties:
              ingredients:
                type: array
                items: {$ref: "#/components/schemas/Ingredient"}
              units:
                type: array
                items: {$ref: "#/components/schemas/Unit"}
    TagList:
      description: The family's meal tags.
      content:
        application/json:
          schema:
            type: object
            required: [tags]
            properties:
              tags:
                type: array
                items: {$ref: "#/components/schemas/Tag"}
    IdResult:
      description: The id of what was saved.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/IdObject"}
    RecipeWithNames:
      description: >-
        The recipe with ingredient and unit names (`…/meals/recipes/{id}`: only those it uses;
        `…/recipes/{id}`: all shared ones).
      content:
        application/json:
          schema:
            type: object
            required: [recipe, ingredients, units]
            properties:
              recipe: {$ref: "#/components/schemas/Recipe"}
              ingredients:
                type: array
                items: {$ref: "#/components/schemas/Ingredient"}
              units:
                type: array
                items: {$ref: "#/components/schemas/Unit"}
    ImageResult:
      description: The recipe's image path ("" without one); load it from `/api/images/{image}`.
      content:
        application/json:
          schema:
            type: object
            required: [image]
            properties:
              image: {type: string}
    PlanChange:
      description: The changed iteration and the body that undoes the change.
      content:
        application/json:
          schema:
            type: object
            required: [iterationId, undo]
            properties:
              iterationId: {type: string}
              undo: {$ref: "#/components/schemas/PlanUndo"}
    CountResult:
      description: How many items changed.
      content:
        application/json:
          schema:
            type: object
            required: [count]
            properties:
              count: {type: integer}
    AiSettings:
      description: "The AI settings (no keys; `Cache-Control: no-store`)."
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AiSettingsEditor"
              - $ref: "#/components/schemas/AiSettingsViewer"
    ChatSummary:
      description: The chat.
      content:
        application/json:
          schema:
            type: object
            required: [chat]
            properties:
              chat: {$ref: "#/components/schemas/Chat"}
    ChatStream:
      description: |
        A Server-Sent Events stream of the chat, read from the database while the worker runs
        the turn. Each event is `event: <name>` and `data: <JSON>`:

        * `chat` — the chat's summary (`Chat`), whenever it changes (status, activity, usage,
          queue);
        * `items` — `{ "rev": n, "items": [{ "seq": i, "item": ChatItem }] }`: items that are
          new or changed since the last revision; replace the item at index `seq`. Streaming
          text arrives as the same assistant item growing (saved about every 0.5 s);
        * `ping` — `{}` every 15 s (keep-alive);
        * `end` — `{}` when no turn runs and nothing waits, `{ "deleted": true }` when the chat
          was deleted;
        * `reconnect` — `{}` after about 100 s: call `GET …/events?since=<last rev>` again.

        Errors found before the stream starts are ordinary JSON `{error}` responses.
      content:
        text/event-stream:
          schema:
            type: string
          x-ohana-event-schemas:
            chat: {$ref: "#/components/schemas/Chat"}
            items: {$ref: "#/components/schemas/ChatItemsEvent"}
            end:
              type: object
              properties:
                deleted: {type: boolean}

  schemas:
    # ---------------------------------------------------------------- common
    Error:
      type: object
      description: Error body of the family API and the account routes.
      required: [error]
      properties:
        error: {type: string}
    Message:
      type: object
      description: Error body of the routes that answer `{message}`.
      required: [message]
      properties:
        message: {type: string}
    Ok:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean, const: true}
    IdObject:
      type: object
      required: [id]
      properties:
        id: {type: string}
    Color:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: A hex color like `#22c55e` (stored lowercase).
    Role:
      type: string
      enum: [editor, viewer]
      description: A member's role in a family.
    BirthdayInput:
      description: "`YYYY-MM-DD` (not in the future), or `\"\"`/`null` for none."
      oneOf:
        - type: string
          pattern: "^(\\d{4}-\\d{2}-\\d{2})?$"
        - type: "null"

    # ---------------------------------------------------------------- server / account
    ServerInfo:
      type: object
      required: [name, version, apiVersion, modules, push]
      properties:
        name: {type: string, const: Ohana}
        version: {type: string, description: "The server release, e.g. `0.1.0`."}
        apiVersion: {type: integer, description: "Raised only when a change would break older clients.", example: 1}
        modules:
          type: array
          description: The enabled modules (`calendar` always).
          items:
            type: string
            enum: [calendar, finance, meals, appointments, assistant]
        push:
          description: Push to the app through a relay; null when the server turned it off.
          oneOf:
            - type: object
              required: [relay]
              properties:
                relay: {type: string, format: uri, description: "The relay the app registers with."}
            - type: "null"
    PushDevice:
      type: object
      required: [registered, platform, mutedFamilyIds, lastSentAt, lastError]
      properties:
        registered: {type: boolean}
        platform: {type: [string, "null"], enum: [ios, macos, null]}
        mutedFamilyIds: {type: array, items: {type: string}}
        lastSentAt: {type: [string, "null"], format: date-time}
        lastError: {type: [string, "null"], description: "The relay's answer to the last failed push (`limited`, `error`)."}
    User:
      type: object
      required: [id, email, name, preferredLanguage, onboardingStep, isAdmin, hasPassword, hasPasskey]
      properties:
        id: {type: string}
        email: {type: string, description: "An email, or a plain sign-in name for imported accounts."}
        name: {type: string}
        preferredLanguage: {type: string, enum: [en, de]}
        onboardingStep: {type: string, enum: [SET_CREDENTIALS, ADD_PASSKEY, COMPLETED]}
        isAdmin: {type: boolean}
        hasPassword: {type: boolean}
        hasPasskey: {type: boolean}
    FamilySummary:
      type: object
      description: A family as the user's family list shows it.
      required: [id, name, role, memberCount]
      properties:
        id: {type: string}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        memberCount: {type: integer}
    FamilyNameInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    AddMemberInput:
      type: object
      required: [email, role]
      properties:
        email: {type: string, minLength: 1, description: "The account's sign-in name (email)."}
        role: {$ref: "#/components/schemas/Role"}
    Passkey:
      type: object
      required: [id, deviceName, createdAt, lastUsedAt]
      properties:
        id: {type: string}
        deviceName: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, "null"], format: date-time}
    ApiToken:
      type: object
      required: [id, name, createdAt, lastUsedAt, current]
      properties:
        id: {type: string}
        name: {type: string, description: "The app's tokens are named \"<device> (app)\"."}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, "null"], format: date-time}
        current: {type: boolean, description: "The token of this request."}
    AccountOverview:
      type: object
      required: [user, passkeys, tokens, sessions]
      properties:
        user: {$ref: "#/components/schemas/User"}
        passkeys:
          type: array
          items: {$ref: "#/components/schemas/Passkey"}
        tokens:
          type: array
          items: {$ref: "#/components/schemas/ApiToken"}
        sessions: {type: integer, description: "Signed-in browsers."}
    AdminUser:
      type: object
      required: [id, email, name, isAdmin, hasPassword, passkeyCount, familyCount, onboardingStep, createdAt]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        isAdmin: {type: boolean}
        hasPassword: {type: boolean}
        passkeyCount: {type: integer}
        familyCount: {type: integer}
        onboardingStep: {type: string}
        createdAt: {type: string, format: date-time}
    AdminFamily:
      type: object
      required: [id, name, createdAt, members]
      properties:
        id: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        members:
          type: array
          items:
            type: object
            required: [userId, email, name, role]
            properties:
              userId: {type: string}
              email: {type: string}
              name: {type: string}
              role: {$ref: "#/components/schemas/Role"}
    SetupLink:
      type: object
      required: [setupUrl, expiresAt]
      properties:
        setupUrl: {type: string, format: uri, description: "Give it to the person; it signs them in once to set their password."}
        expiresAt: {type: string, format: date-time}
    InviteSummary:
      type: object
      required: [familyId, familyName, role, personName, expiresAt, alreadyMember]
      properties:
        familyId: {type: string}
        familyName: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        personName: {type: [string, "null"], description: "The person without an account the invite is for, if any."}
        expiresAt: {type: string, format: date-time}
        alreadyMember: {type: boolean}

    # ---------------------------------------------------------------- family / calendar
    FamilyInfo:
      type: object
      required: [id, feedId, name, access, readOnly, updatedAt]
      properties:
        id: {type: string}
        feedId: {type: string, description: "Secret id of the public calendar feed: `/api/v1/families/{feedId}/calendar.ics`."}
        legacyId: {type: string, description: "Family-planner's old view id (also a feed id); editors only, when set."}
        name: {type: string}
        access: {type: string, enum: [edit, view]}
        readOnly: {type: boolean}
        updatedAt: {type: string, format: date-time}
    FamilyState:
      type: object
      required: [family, session, types, typeYears, entries, notes]
      properties:
        family: {$ref: "#/components/schemas/FamilyInfo"}
        session:
          $ref: "#/components/schemas/FamilyInfo"
          description: The same as `family` (family-planner's old name, kept for scripts).
        types:
          type: array
          description: The entry types of the range's years (all years without a range).
          items: {$ref: "#/components/schemas/EntryType"}
        typeYears:
          type: array
          description: Every year that has entry types.
          items: {type: integer}
        entries: {$ref: "#/components/schemas/EntriesByDay"}
        notes: {$ref: "#/components/schemas/NotesByDay"}
        events:
          type: object
          description: Day → the timed events of that day.
          additionalProperties:
            type: array
            items: {$ref: "#/components/schemas/Event"}
        birthdays:
          type: object
          description: Day → birthdays that day (only when the range has both ends).
          additionalProperties:
            type: array
            items:
              type: object
              required: [name, age]
              properties:
                name: {type: string}
                age: {type: integer, description: "The age they turn."}
    EntryTypeRole:
      type: string
      enum: [none, needs_cover, covers, day_off]
      default: none
      description: >-
        How the type counts for coverage: `needs_cover` (someone must cover the day),
        `covers` (covers a day), `day_off` (no cover needed, e.g. a holiday), `none`.
    EntryType:
      type: object
      required: [id, year, name, color, role, position, away]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$", description: "Unique within the year (made from the name)."}
        year: {type: integer}
        name: {type: string, maxLength: 80}
        color: {$ref: "#/components/schemas/Color"}
        role: {$ref: "#/components/schemas/EntryTypeRole"}
        position: {type: integer}
        away: {type: boolean, description: "The whole family is away on its days (the meal plan skips them)."}
    EntriesByDay:
      type: object
      description: Day (YYYY-MM-DD) → ids of the entry types on that day.
      additionalProperties:
        type: array
        items: {type: string}
    Note:
      type: object
      required: [icon, comment]
      properties:
        icon: {type: string, maxLength: 16, description: "An emoji."}
        comment: {type: string, maxLength: 500}
    NotesByDay:
      type: object
      description: Day (YYYY-MM-DD) → its note.
      additionalProperties: {$ref: "#/components/schemas/Note"}
    DaySelection:
      type: object
      description: >-
        The days of an op: `dates` and/or `date` and/or a range `from`–`to` (max. 3 years);
        `skipWeekends` drops Saturdays and Sundays.
      properties:
        dates:
          type: array
          items: {type: string, format: date}
        date: {type: string, format: date}
        from: {type: string, format: date}
        to: {type: string, format: date}
        skipWeekends: {type: boolean, default: false}
    EntryOp:
      allOf:
        - $ref: "#/components/schemas/DaySelection"
        - type: object
          properties:
            action:
              type: string
              enum: [add, remove, set, clear]
              default: add
              description: >-
                `add` the types, `remove` them, `set` the days to exactly these types, `clear`
                all entries of the days.
            type: {type: string, description: "An entry type by id or name (in each day's year)."}
            types:
              type: array
              items: {type: string}
    NoteOp:
      allOf:
        - $ref: "#/components/schemas/DaySelection"
        - type: object
          properties:
            action: {type: string, enum: [set, clear], default: set}
            icon: {type: string, maxLength: 16}
            comment: {type: string, maxLength: 500}
          description: "`set` needs `icon` or `comment`; a set with both empty clears the note."
    Event:
      type: object
      description: A timed (or all-day) event on a calendar day.
      required: [id, date, start, end, title, location, person, note, url, source, searchId]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        start: {type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "Wall-clock HH:MM; null = all day."}
        end: {type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        title: {type: string}
        location: {type: string}
        person: {type: string, description: "Who it is for."}
        note: {type: string}
        url: {type: string}
        source: {type: string, enum: [manual, appointment]}
        searchId: {type: [string, "null"], description: "The appointment search it was booked from."}
    EventInput:
      type: object
      required: [date, title]
      description: "`end` needs a `start` and must not be before it."
      properties:
        date: {type: string, format: date}
        start: {type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        end: {type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        title: {type: string, minLength: 1, maxLength: 200}
        location: {type: string, maxLength: 300, default: ""}
        person: {type: string, maxLength: 80, default: ""}
        note: {type: string, maxLength: 1000, default: ""}
        url: {type: string, maxLength: 2000, default: "", description: "http(s) only."}
    EventPatch:
      type: object
      description: Any fields of `EventInput`; the others stay.
      properties:
        date: {type: string, format: date}
        start: {type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        end: {type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        title: {type: string, minLength: 1, maxLength: 200}
        location: {type: string, maxLength: 300}
        person: {type: string, maxLength: 80}
        note: {type: string, maxLength: 1000}
        url: {type: string, maxLength: 2000}
    ExportFile:
      type: object
      description: >-
        A family's export file. `format` `family-planner` (or the older `vacation-planner`);
        version 1 has no finances (an import of it leaves them alone).
      required: [format, version, types]
      properties:
        format: {type: string, enum: [family-planner, vacation-planner]}
        version: {type: integer, enum: [1, 2]}
        exportedAt: {type: string, format: date-time}
        name: {type: string}
        types:
          type: array
          items: {$ref: "#/components/schemas/EntryType"}
        entries: {$ref: "#/components/schemas/EntriesByDay"}
        notes: {$ref: "#/components/schemas/NotesByDay"}
        finance:
          type: object
          properties:
            currency: {type: string}
            categories:
              type: array
              items: {$ref: "#/components/schemas/Category"}
            accounts:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  name: {type: string}
                  color: {$ref: "#/components/schemas/Color"}
                  icon: {type: string}
                  openingCents: {type: integer}
                  position: {type: integer}
            transactions:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Transaction"
                  - type: object
                    properties:
                      importHash: {type: [string, "null"]}
    BirthdayDay:
      type: object
      required: [day, name, age]
      properties:
        day: {type: string, format: date}
        name: {type: string}
        age: {type: integer, description: "The age they turn that day."}

    # ---------------------------------------------------------------- search
    SearchResult:
      type: object
      required: [query, currency, results, more]
      properties:
        query: {type: string, description: "The query as searched (trimmed)."}
        currency: {type: string, description: "The family's currency (ISO 4217), for the amounts."}
        results:
          type: array
          items: {$ref: "#/components/schemas/SearchHit"}
        more:
          type: object
          description: How many more hits than listed, per kind (kinds without more are left out).
          additionalProperties: {type: integer}
    SearchHit:
      type: object
      required: [kind, id, title, detail, day]
      properties:
        kind: {type: string, enum: [recipe, event, note, transaction, search, person, chat]}
        id:
          type: string
          description: >-
            The item's id (a member's user id for a person with an account); a note's is its day.
        title: {type: string}
        detail: {type: string, description: "More of the item, joined with \" · \" (may be empty)."}
        day: {type: [string, "null"], format: date, description: "An event's, note's or transaction's day; a chat's last change."}
        time: {type: [string, "null"], description: "An event's start (HH:MM), null all day."}
        amountCents: {type: integer, description: "A transaction's amount; negative: money going out."}
        account: {type: boolean, description: "A person: a member with an account (else a person without one)."}

    # ---------------------------------------------------------------- overview
    Dashboard:
      type: object
      required: [today, calendar, awayToday, todayEvents, upcoming, meals, finance, searches, birthdays]
      properties:
        today: {type: string, format: date}
        calendar:
          type: object
          required: [nextGap, upcoming]
          properties:
            nextGap: {type: [string, "null"], format: date, description: "The first uncovered weekday from today on."}
            upcoming:
              type: array
              items:
                type: object
                required: [name, color, from, to]
                properties:
                  name: {type: string}
                  color: {$ref: "#/components/schemas/Color"}
                  from: {type: string, format: date}
                  to: {type: string, format: date}
        awayToday:
          type: array
          description: Names of today's "away" types.
          items: {type: string}
        todayEvents:
          type: array
          items: {$ref: "#/components/schemas/Event"}
        upcoming:
          type: array
          description: Calendar runs and timed events of the next 30 days (at most 8).
          items:
            oneOf:
              - type: object
                required: [kind, date, to, name, color]
                properties:
                  kind: {type: string, const: entry}
                  date: {type: string, format: date}
                  to: {type: string, format: date}
                  name: {type: string}
                  color: {$ref: "#/components/schemas/Color"}
              - type: object
                required: [kind, date, event]
                properties:
                  kind: {type: string, const: event}
                  date: {type: string, format: date}
                  event: {$ref: "#/components/schemas/Event"}
        meals:
          type: object
          required: [today, shopping]
          properties:
            today:
              type: [object, "null"]
              required: [recipeId, recipeTitle, isLeftover]
              properties:
                recipeId: {type: string}
                recipeTitle: {type: string}
                isLeftover: {type: boolean}
            shopping:
              type: [object, "null"]
              required: [id, shoppingDate, open, total]
              properties:
                id: {type: string}
                shoppingDate: {type: [string, "null"], format: date}
                open: {type: integer}
                total: {type: integer}
        finance:
          type: object
          required: [currency, month, incomeCents, expenseCents, count, topExpense, balanceCents]
          properties:
            currency: {type: string}
            month: {type: string, pattern: "^\\d{4}-\\d{2}$"}
            incomeCents: {type: integer}
            expenseCents: {type: integer}
            count: {type: integer}
            topExpense:
              type: [object, "null"]
              required: [categoryId, name, icon, color, expenseCents]
              properties:
                categoryId: {type: string}
                name: {type: string}
                icon: {type: string}
                color: {type: string}
                expenseCents: {type: integer}
            balanceCents: {type: [integer, "null"], description: "All accounts together; null without accounts."}
        searches:
          type: array
          items:
            type: object
            required: [id, name, enabled, lastStatus, first, doctors]
            properties:
              id: {type: string}
              name: {type: string}
              enabled: {type: boolean}
              lastStatus: {type: string}
              first:
                type: [object, "null"]
                required: [resultId, doctorName, slot]
                properties:
                  resultId: {type: integer}
                  doctorName: {type: string}
                  slot: {type: string, format: date-time}
              doctors: {type: integer}
        birthdays:
          type: array
          description: Birthdays from today to 29 days on.
          items: {$ref: "#/components/schemas/BirthdayDay"}

    # ---------------------------------------------------------------- household
    Member:
      type: object
      required: [userId, email, name, role, birthday, joinedAt]
      properties:
        userId: {type: string}
        email: {type: string}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        birthday: {type: [string, "null"], format: date}
        joinedAt: {type: string, format: date-time}
    Person:
      type: object
      description: A member without an account (a child, a grandparent).
      required: [id, name, birthday]
      properties:
        id: {type: string}
        name: {type: string}
        birthday: {type: [string, "null"], format: date}
        createdAt: {type: string, format: date-time, description: "Only in the answer of `POST …/people`."}
    CreatedInvite:
      type: object
      required: [code, expiresAt, url]
      properties:
        code: {type: string}
        expiresAt: {type: string, format: date-time}
        url: {type: string, format: uri, description: "The invite link (`<server>/invite/<code>`)."}
    HouseholdInvite:
      type: object
      required: [id, url, role, personId, expiresAt]
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        role: {$ref: "#/components/schemas/Role"}
        personId: {type: [string, "null"]}
        expiresAt: {type: string, format: date-time}
    HomeAddress:
      type: object
      required: [address, lat, lng]
      properties:
        address: {type: [string, "null"]}
        lat: {type: [number, "null"]}
        lng: {type: [number, "null"]}
    Household:
      type: object
      required: [name, role, selfId, members, people, invites, home, channels, events]
      properties:
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        selfId: {type: string, description: "The caller's user id."}
        members:
          type: array
          items: {$ref: "#/components/schemas/Member"}
        people:
          type: array
          items: {$ref: "#/components/schemas/Person"}
        invites:
          type: array
          description: Open invites (editors only; [] for viewers).
          items: {$ref: "#/components/schemas/HouseholdInvite"}
        home: {$ref: "#/components/schemas/HomeAddress"}
        channels:
          type: array
          items: {$ref: "#/components/schemas/Channel"}
        events:
          type: array
          items: {$ref: "#/components/schemas/EventPref"}
    ChannelProvider:
      type: string
      enum: [PUSHBULLET, PUSHOVER, TELEGRAM, EMAIL, NTFY]
      description: >-
        Required fields: PUSHBULLET `token`; PUSHOVER `token` (app token) + `target` (user
        key); TELEGRAM `token` (bot token) + `target` (chat id); EMAIL `smtpHost`,
        `smtpUsername`, `token` (SMTP password) + `target` (recipient); NTFY `target` (the
        topic URL, e.g. `https://ntfy.sh/my-topic`), `token` optional (access token).
    Channel:
      type: object
      description: A notification channel; its secret is never returned (`hasToken`).
      required: [id, name, provider, target, enabled, hasToken, smtpHost, smtpPort, smtpUsername, smtpFrom]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {$ref: "#/components/schemas/ChannelProvider"}
        target: {type: string}
        enabled: {type: boolean}
        hasToken: {type: boolean}
        smtpHost: {type: string}
        smtpPort: {type: integer}
        smtpUsername: {type: string}
        smtpFrom: {type: string}
    ChannelInput:
      type: object
      required: [name, provider]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        provider: {$ref: "#/components/schemas/ChannelProvider"}
        token: {type: string, default: "", description: "The secret (API key, bot token, SMTP password, ntfy access token). Blank on update: keep the stored one."}
        target: {type: string, default: ""}
        smtpHost: {type: string, default: ""}
        smtpPort: {type: integer, minimum: 1, maximum: 65535, default: 465}
        smtpUsername: {type: string, default: ""}
        smtpFrom: {type: string, default: ""}
        enabled: {type: boolean, default: true}
    NotifyEvent:
      type: string
      enum: [appointment_found, coverage_gap, shopping_reminder, assistant_turn_finished]
      description: >-
        `appointment_found` (on by default; the searches pick their channels),
        `coverage_gap` (on; a weekday nobody covers, once a day), `shopping_reminder` (off;
        once per shopping day), `assistant_turn_finished` (off; when nobody watches the chat).
    EventPref:
      type: object
      required: [event, enabled, channelIds, app, hasChannels]
      properties:
        event: {$ref: "#/components/schemas/NotifyEvent"}
        enabled: {type: boolean}
        channelIds:
          type: [array, "null"]
          description: null = all of the family's enabled channels.
          items: {type: string}
        app: {type: boolean, description: "Also pushed to the members' app devices (default true)."}
        hasChannels: {type: boolean, description: "Whether the event picks its channels here."}

    # ---------------------------------------------------------------- finance
    CategoryKind:
      type: string
      enum: [income, expense, both]
    Category:
      type: object
      required: [id, name, color, icon, kind, position, parentId]
      properties:
        id: {type: string}
        name: {type: string}
        color: {$ref: "#/components/schemas/Color"}
        icon: {type: string, maxLength: 16}
        kind: {$ref: "#/components/schemas/CategoryKind"}
        position: {type: integer}
        parentId: {type: [string, "null"]}
    CategoryInput:
      type: object
      required: [name, color]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        color: {$ref: "#/components/schemas/Color"}
        icon: {type: string, maxLength: 16}
        kind: {$ref: "#/components/schemas/CategoryKind"}
        parentId: {type: [string, "null"], description: "Parent by id, name or path; none = top level."}
    CategoryPatch:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        color: {$ref: "#/components/schemas/Color"}
        icon: {type: string, maxLength: 16}
        kind: {$ref: "#/components/schemas/CategoryKind"}
        position: {type: integer}
        parentId: {type: [string, "null"]}
    Account:
      type: object
      description: A finance account with its balance.
      required: [id, name, color, icon, openingCents, position, balanceCents]
      properties:
        id: {type: string}
        name: {type: string}
        color: {$ref: "#/components/schemas/Color"}
        icon: {type: string}
        openingCents: {type: integer}
        position: {type: integer}
        balanceCents: {type: integer, description: "Opening balance plus the transactions (up to `at`)."}
    Transaction:
      type: object
      required: [id, date, amountCents, payee, description, categoryId, accountId, transferId, splitOf, split, note, imported]
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        amountCents: {type: integer, description: "Positive income, negative expense."}
        payee: {type: string}
        description: {type: string}
        categoryId: {type: [string, "null"]}
        accountId: {type: [string, "null"]}
        transferId: {type: [string, "null"], format: uuid, description: "The transfer group (only for groups with at least two legs)."}
        splitOf: {type: [string, "null"], format: uuid, description: "The split booking this is a part of."}
        split:
          type: [object, "null"]
          description: For a split booking, its parts and what they don't cover.
          required: [parts, remainderCents]
          properties:
            parts: {type: integer}
            remainderCents: {type: integer}
        note: {type: string}
        imported: {type: boolean}
    TransactionOp:
      type: object
      description: |
        One change; `action` defaults to `add`.

        * `add` — `date`, `amountCents` required; `id` (uuid) to put a transaction back with
          its id (replaces one with that id); `payee` (≤200), `description` (≤500), `note`
          (≤500), `categoryId` / `accountId` (id or name; category also path), `transferId`,
          `splitOf`.
        * `update` — `id` and the fields to change (`date`, `amountCents`, `payee`,
          `description`, `categoryId`, `accountId`, `transferId`, `note`).
        * `delete` / `unlink` / `unsplit` — `id` or `ids`. `unlink` dissolves the whole transfer
          group; `unsplit` makes all parts normal again. Parts of a deleted booking stay.
        * `link` — `ids` (at least 2): a new transfer group.
        * `split` — `id` (the booking) and `ids` (its parts).
      properties:
        action: {type: string, enum: [add, update, delete, link, unlink, split, unsplit], default: add}
        id: {type: string, format: uuid}
        ids:
          type: array
          items: {type: string, format: uuid}
        date: {type: string, format: date}
        amountCents: {type: integer}
        payee: {type: string, maxLength: 200}
        description: {type: string, maxLength: 500}
        note: {type: string, maxLength: 500}
        categoryId: {type: [string, "null"]}
        accountId: {type: [string, "null"]}
        transferId: {type: [string, "null"], format: uuid}
        splitOf: {type: [string, "null"], format: uuid}
    TransactionOpsResult:
      type: object
      required: [ok, changed, added, inverse]
      properties:
        ok: {type: boolean, const: true}
        changed: {type: integer}
        added:
          type: array
          description: Ids of transactions added (or put back).
          items: {type: string, format: uuid}
        inverse:
          type: array
          description: "Ops that undo this request; send them as `{ \"ops\": inverse }` to `POST …/finance/transactions`."
          items: {$ref: "#/components/schemas/TransactionOp"}
    CentsRange:
      type: object
      required: [lowCents, highCents]
      properties:
        lowCents: {type: integer, minimum: 0}
        highCents: {type: integer, minimum: 0}
    Benchmark:
      type: object
      description: A statistic average (per month) the overview compares the months with.
      required: [label, income, expense, categories]
      properties:
        label: {type: string, maxLength: 120}
        income:
          oneOf:
            - $ref: "#/components/schemas/CentsRange"
            - type: "null"
        expense:
          oneOf:
            - $ref: "#/components/schemas/CentsRange"
            - type: "null"
        categories:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CentsRange"
              - type: object
                required: [categoryId]
                properties:
                  categoryId: {type: string}
    BenchmarkInput:
      type: object
      description: Amounts per month, each a number or `{lowCents, highCents}` (one is enough).
      properties:
        label: {type: string}
        income:
          oneOf:
            - type: integer
            - $ref: "#/components/schemas/CentsRangeInput"
            - type: "null"
        expense:
          oneOf:
            - type: integer
            - $ref: "#/components/schemas/CentsRangeInput"
            - type: "null"
        categories:
          type: array
          items:
            type: object
            required: [categoryId]
            properties:
              categoryId: {type: string, description: "Id, name or path."}
              cents: {type: integer}
              lowCents: {type: [integer, "null"]}
              highCents: {type: [integer, "null"]}
    CentsRangeInput:
      type: object
      properties:
        lowCents: {type: [integer, "null"], minimum: 0}
        highCents: {type: [integer, "null"], minimum: 0}
    FinanceOverview:
      type: object
      required: [currency, csvMappings, benchmark, groceriesCategoryId, categories, accounts]
      properties:
        currency: {type: string, description: "ISO 4217 (default EUR)."}
        csvMappings:
          type: array
          items: {type: object, additionalProperties: true}
        benchmark:
          oneOf:
            - $ref: "#/components/schemas/Benchmark"
            - type: "null"
        groceriesCategoryId: {type: [string, "null"], description: "null = the default (Groceries / Lebensmittel)."}
        categories:
          type: array
          items: {$ref: "#/components/schemas/Category"}
        accounts:
          type: array
          items: {$ref: "#/components/schemas/Account"}
    FinanceSummary:
      type: object
      required: [currency, incomeCents, expenseCents, count, months, categories]
      properties:
        currency: {type: string}
        incomeCents: {type: integer}
        expenseCents: {type: integer}
        count: {type: integer, description: "Items counted (a transfer group once)."}
        months:
          type: array
          items:
            type: object
            required: [month, incomeCents, expenseCents]
            properties:
              month: {type: string, pattern: "^\\d{4}-\\d{2}$"}
              incomeCents: {type: integer}
              expenseCents: {type: integer}
        categories:
          type: array
          description: Per category (null = uncategorized), most expenses first.
          items:
            type: object
            required: [categoryId, incomeCents, expenseCents, count]
            properties:
              categoryId: {type: [string, "null"]}
              incomeCents: {type: integer}
              expenseCents: {type: integer}
              count: {type: integer}
    ShoppingLinks:
      type: object
      required: [categoryIds, lists]
      properties:
        categoryIds:
          type: array
          description: The groceries category and its subcategories.
          items: {type: string}
        lists:
          type: array
          items:
            type: object
            required: [date, id]
            properties:
              date: {type: string, format: date}
              id: {type: string}
    ShoppingSpend:
      type: object
      required: [currency, category, from, to, transactions, totalCents]
      properties:
        currency: {type: string}
        category:
          type: [object, "null"]
          required: [id, name, icon, color]
          properties:
            id: {type: string}
            name: {type: string}
            icon: {type: string}
            color: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        transactions:
          type: array
          items:
            type: object
            required: [id, date, payee, description, amountCents]
            properties:
              id: {type: string}
              date: {type: string, format: date}
              payee: {type: string}
              description: {type: string}
              amountCents: {type: integer}
        totalCents: {type: integer, description: "Spent (expenses minus refunds); positive."}
    CategorizeResult:
      type: object
      required: [changed, matched, considered, remaining, ai, inverse, assignments]
      properties:
        changed: {type: integer}
        matched: {type: integer, description: "Sorted like similar earlier transactions."}
        considered: {type: integer}
        remaining: {type: integer, description: "Uncategorized rows in the range not looked at yet."}
        ai: {type: boolean, description: "The model was asked (the AI is set up)."}
        inverse:
          type: array
          items: {$ref: "#/components/schemas/TransactionOp"}
        assignments:
          type: array
          items:
            type: object
            required: [id, categoryId, source]
            properties:
              id: {type: string, format: uuid}
              categoryId: {type: string}
              source: {type: string, enum: [similar, ai]}

    # ---------------------------------------------------------------- meals
    RecipeListType:
      type: string
      enum: [KNOWN, TO_TRY]
      description: "`KNOWN` recipes the family cooks, `TO_TRY` ones to try."
    IngredientCategory:
      type: string
      enum: [PRODUCE, DAIRY, MEAT, PANTRY, FROZEN, OTHER]
    Tag:
      type: object
      required: [id, category, nameEn, nameDe]
      properties:
        id: {type: string}
        category: {type: string}
        nameEn: {type: string}
        nameDe: {type: string}
    Ingredient:
      type: object
      description: A shared ingredient (the same for all families).
      required: [id, nameEn, nameDe, category]
      properties:
        id: {type: integer}
        nameEn: {type: string}
        nameDe: {type: string}
        category: {$ref: "#/components/schemas/IngredientCategory"}
    Unit:
      type: object
      description: A shared unit.
      required: [id, nameEn, nameDe, abbreviation]
      properties:
        id: {type: integer}
        nameEn: {type: string}
        nameDe: {type: string}
        abbreviation: {type: string}
    RecipeSummary:
      type: object
      required: [id, title, description, listType, defaultServings, prepTimeMinutes, cookTimeMinutes, leftoverDays, image, createdAt, updatedAt, tags]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        listType: {$ref: "#/components/schemas/RecipeListType"}
        defaultServings: {type: integer}
        prepTimeMinutes: {type: [integer, "null"]}
        cookTimeMinutes: {type: [integer, "null"]}
        leftoverDays: {type: [integer, "null"], description: "Days the meal lasts as leftovers."}
        image: {type: string, description: "Photo path for `/api/images/{image}`; \"\" without one."}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        tags:
          type: array
          items: {$ref: "#/components/schemas/Tag"}
    RecipeIngredient:
      type: object
      required: [id, ingredientId, quantity, unitId, order]
      properties:
        id: {type: integer}
        ingredientId: {type: integer}
        quantity: {type: string, description: "A decimal as text."}
        unitId: {type: integer}
        order: {type: integer}
    CookingStep:
      type: object
      required: [id, method, stepNumber, instruction, programType, temperature, durationSeconds, speed, turbo, direction, weightGrams, ingredients]
      properties:
        id: {type: integer}
        method: {type: string, enum: [MANUAL, MACHINE], description: "`MACHINE`: a step for a kitchen machine (Thermomix-like program)."}
        stepNumber: {type: integer}
        instruction: {type: string}
        programType: {type: string}
        temperature: {type: [integer, "null"]}
        durationSeconds: {type: [integer, "null"]}
        speed: {type: [integer, "null"]}
        turbo: {type: boolean}
        direction: {type: string}
        weightGrams: {type: [integer, "null"]}
        ingredients:
          type: array
          items:
            type: object
            required: [recipeIngredientId, quantity]
            properties:
              recipeIngredientId: {type: integer}
              quantity: {type: string}
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          required: [ingredients, manualSteps, machineSteps]
          properties:
            ingredients:
              type: array
              items: {$ref: "#/components/schemas/RecipeIngredient"}
            manualSteps:
              type: array
              items: {$ref: "#/components/schemas/CookingStep"}
            machineSteps:
              type: array
              items: {$ref: "#/components/schemas/CookingStep"}
    RecipeList:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RecipeSummary"}
        totalCount: {type: integer}
    RecipeInput:
      type: object
      description: >-
        A whole recipe. An ingredient is given by `ingredientId`, or (null) by `nameEn` /
        `nameDe` (found or added to the shared list). Steps refer to the recipe's ingredients
        by their `order`.
      required: [title, description, listType, defaultServings, prepTimeMinutes, cookTimeMinutes, leftoverDays, ingredients, steps, tagIds]
      properties:
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        listType: {$ref: "#/components/schemas/RecipeListType"}
        defaultServings: {type: integer, minimum: 1, maximum: 100}
        prepTimeMinutes: {type: [integer, "null"]}
        cookTimeMinutes: {type: [integer, "null"]}
        leftoverDays: {type: [integer, "null"]}
        ingredients:
          type: array
          maxItems: 200
          items:
            type: object
            required: [ingredientId, nameEn, nameDe, quantity, unitId, order]
            properties:
              ingredientId: {type: [integer, "null"]}
              nameEn: {type: string, maxLength: 200}
              nameDe: {type: string, maxLength: 200}
              quantity: {type: string, maxLength: 40}
              unitId: {type: integer}
              order: {type: integer}
        steps:
          type: array
          maxItems: 200
          items:
            type: object
            required: [method, stepNumber, instruction, programType, temperature, durationSeconds, speed, turbo, direction, weightGrams, ingredients]
            properties:
              method: {type: string, enum: [MANUAL, MACHINE]}
              stepNumber: {type: integer}
              instruction: {type: string, maxLength: 5000}
              programType: {type: string, maxLength: 40}
              temperature: {type: [integer, "null"]}
              durationSeconds: {type: [integer, "null"]}
              speed: {type: [integer, "null"]}
              turbo: {type: boolean}
              direction: {type: string, maxLength: 10}
              weightGrams: {type: [integer, "null"]}
              ingredients:
                type: array
                maxItems: 200
                items:
                  type: object
                  required: [recipeIngredientOrder, quantity]
                  properties:
                    recipeIngredientOrder: {type: integer}
                    quantity: {type: string, maxLength: 40}
        tagIds:
          type: array
          maxItems: 100
          items: {type: string}
    BulkStep:
      type: object
      required: [stepNumber]
      properties:
        stepNumber: {type: integer}
        instruction: {type: string, default: ""}
        programType: {type: string}
        temperature: {type: [integer, "null"]}
        durationSeconds: {type: [integer, "null"]}
        speed: {type: [integer, "null"]}
        turbo: {type: boolean}
        direction: {type: string}
        weightGrams: {type: [integer, "null"]}
    BulkRecipe:
      type: object
      required: [title, defaultServings, prepTimeMinutes, cookTimeMinutes, leftoverDays, ingredients, manualSteps, machineSteps, tagIds]
      properties:
        title: {type: string}
        description: {type: string}
        defaultServings: {type: integer}
        prepTimeMinutes: {type: [integer, "null"]}
        cookTimeMinutes: {type: [integer, "null"]}
        leftoverDays: {type: [integer, "null"]}
        ingredients:
          type: array
          items:
            type: object
            required: [nameEn, nameDe, quantity, unitAbbreviation]
            properties:
              nameEn: {type: string}
              nameDe: {type: string}
              category: {type: string, default: OTHER}
              quantity: {type: string}
              unitAbbreviation: {type: string}
              order: {type: integer, default: 0}
        manualSteps:
          type: array
          items: {$ref: "#/components/schemas/BulkStep"}
        machineSteps:
          type: array
          items: {$ref: "#/components/schemas/BulkStep"}
        tagIds:
          type: array
          items: {type: string}
        imageBase64: {type: [string, "null"], maxLength: 4000000, description: "The photo (e.g. from the generator's `image` event)."}
    GeneratedRecipe:
      type: object
      description: A recipe as the generator streams it (snake_case; map it to `BulkRecipe` to save it).
      required: [title, description, default_servings, prep_time_minutes, cook_time_minutes, leftover_days, ingredients, manual_steps, machine_steps, tag_names_en, tag_ids]
      properties:
        title: {type: string}
        description: {type: string}
        default_servings: {type: integer}
        prep_time_minutes: {type: [integer, "null"]}
        cook_time_minutes: {type: [integer, "null"]}
        leftover_days: {type: [integer, "null"]}
        ingredients:
          type: array
          items:
            type: object
            required: [name_en, name_de, category, quantity, unit_abbreviation, unit_id, order]
            properties:
              name_en: {type: string}
              name_de: {type: string}
              category: {type: string}
              quantity: {type: string}
              unit_abbreviation: {type: string}
              unit_id: {type: [integer, "null"]}
              order: {type: integer}
        manual_steps:
          type: array
          items: {type: object, additionalProperties: true, description: "`step_number`, `instruction` and the machine fields in snake_case."}
        machine_steps:
          type: array
          items: {type: object, additionalProperties: true}
        tag_names_en:
          type: array
          items: {type: string}
        tag_ids:
          type: array
          items: {type: string}
    GenerationEvent:
      description: One line of the recipe generator's NDJSON stream.
      oneOf:
        - type: object
          required: [type, index, data]
          properties:
            type: {type: string, const: recipe}
            index: {type: integer}
            data: {$ref: "#/components/schemas/GeneratedRecipe"}
        - type: object
          required: [type, index, data]
          properties:
            type: {type: string, const: image}
            index: {type: integer}
            data:
              type: object
              required: [image_base64]
              properties:
                image_base64: {type: string, contentEncoding: base64, contentMediaType: image/webp}
        - type: object
          required: [type, message]
          properties:
            type: {type: string, enum: [image_error, error]}
            message: {type: string}
        - type: object
          required: [type]
          properties:
            type: {type: string, const: done}
    PlanEntry:
      type: object
      required: [id, date, mealType, recipeId, recipeTitle, servings, isLeftover, sourceEntryId, isLocked]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        mealType: {type: string}
        recipeId: {type: string}
        recipeTitle: {type: string}
        servings: {type: integer}
        isLeftover: {type: boolean}
        sourceEntryId: {type: [string, "null"], description: "The meal a leftover day comes from."}
        isLocked: {type: boolean}
    PlanIteration:
      type: object
      required: [id, startDate, endDate, status, entries, shoppingLists, createdAt]
      properties:
        id: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        status: {type: string, enum: [ACTIVE, ARCHIVED]}
        entries:
          type: array
          items: {$ref: "#/components/schemas/PlanEntry"}
        shoppingLists:
          type: array
          items:
            type: object
            required: [id, shoppingDate, itemCount]
            properties:
              id: {type: string}
              shoppingDate: {type: [string, "null"], format: date}
              itemCount: {type: integer}
        createdAt: {type: string, format: date-time}
    MealPlan:
      type: object
      required: [id, iterationWeeks, shoppingDays, servings, knownRatio, defaultLeftoverDays, excludedTagIds, iterations, createdAt]
      properties:
        id: {type: string}
        iterationWeeks: {type: integer}
        shoppingDays:
          type: array
          description: Weekdays (0 = Sunday … 6 = Saturday).
          items: {type: integer}
        servings: {type: integer}
        knownRatio: {type: string, description: "Share of known recipes (a decimal as text, 0–1)."}
        defaultLeftoverDays: {type: integer}
        excludedTagIds:
          type: array
          items: {type: string}
        iterations:
          type: array
          items: {$ref: "#/components/schemas/PlanIteration"}
        createdAt: {type: string, format: date-time}
    SetupPlanInput:
      type: object
      required: [iterationWeeks, shoppingDays, servings, knownRatio, defaultLeftoverDays]
      properties:
        iterationWeeks: {type: integer, minimum: 1, maximum: 3}
        shoppingDays:
          type: array
          minItems: 1
          maxItems: 2
          items: {type: integer, minimum: 0, maximum: 6}
        servings: {type: integer, minimum: 1, maximum: 12}
        knownRatio: {type: number, minimum: 0, maximum: 1}
        defaultLeftoverDays: {type: integer, minimum: 0, maximum: 3}
        excludedTagIds:
          type: array
          default: []
          items: {type: string, format: uuid}
    IterationSnapshot:
      type: object
      description: An iteration's meals and shopping lists (ticks included), as taken before a change.
      required: [id, startDate, endDate, status, entries, lists]
      properties:
        id: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        status: {type: string, enum: [ACTIVE, ARCHIVED]}
        entries:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, date, mealType, recipeId, servings, isLeftover, sourceEntryId, isLocked]
            properties:
              id: {type: string}
              date: {type: string, format: date}
              mealType: {type: string, maxLength: 20}
              recipeId: {type: string}
              servings: {type: integer, minimum: 1, maximum: 100}
              isLeftover: {type: boolean}
              sourceEntryId: {type: [string, "null"]}
              isLocked: {type: boolean}
        lists:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, shoppingDate, items]
            properties:
              id: {type: string}
              shoppingDate: {type: [string, "null"]}
              items:
                type: array
                maxItems: 1000
                items:
                  type: object
                  required: [id, ingredientId, unitId, quantity, isChecked]
                  properties:
                    id: {type: string}
                    ingredientId: {type: integer}
                    unitId: {type: integer}
                    quantity: {type: string, maxLength: 40}
                    isChecked: {type: boolean}
    PlanUndo:
      type: object
      description: Puts iterations back as they were (`restore`) and deletes the ones a change added (`remove`).
      properties:
        restore:
          type: array
          maxItems: 10
          default: []
          items: {$ref: "#/components/schemas/IterationSnapshot"}
        remove:
          type: array
          maxItems: 10
          default: []
          items: {type: string}
    ShoppingItem:
      type: object
      required: [id, ingredientName, category, quantity, unitAbbreviation, isChecked]
      properties:
        id: {type: string}
        ingredientName: {type: string}
        category: {$ref: "#/components/schemas/IngredientCategory"}
        quantity: {type: string}
        unitAbbreviation: {type: string}
        isChecked: {type: boolean}
    ShoppingList:
      type: object
      required: [id, shoppingDate, createdAt, items]
      properties:
        id: {type: string}
        shoppingDate: {type: [string, "null"], format: date}
        createdAt: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: "#/components/schemas/ShoppingItem"}
    ShoppingListSummary:
      type: object
      required: [id, iterationId, iterationStatus, shoppingDate, itemCount, checkedCount]
      properties:
        id: {type: string}
        iterationId: {type: string}
        iterationStatus: {type: string, enum: [ACTIVE, ARCHIVED]}
        shoppingDate: {type: [string, "null"], format: date}
        itemCount: {type: integer}
        checkedCount: {type: integer}

    # ---------------------------------------------------------------- appointments
    AppointmentHome:
      type: object
      required: [address, lat, lng]
      properties:
        address: {type: string}
        lat: {type: number}
        lng: {type: number}
    LocationSuggestion:
      type: object
      required: [label, latitude, longitude]
      properties:
        label: {type: string}
        latitude: {type: string}
        longitude: {type: string}
    JamedaTerm:
      type: object
      required: [slug, label, type]
      properties:
        slug: {type: string}
        label: {type: string}
        type: {type: string, enum: [specialization, leistung, erkrankung]}
    SearchInput:
      type: object
      description: >-
        An appointment search. `sources` `doctolib` needs `specialitySlug`, `jameda` needs
        `jamedaSpecialitySlug` (both for `both`). Pick the location with `…/geocode`.
        `scheduleType` `CRON` needs a five-field `cron`.
      required: [name, latitude, longitude]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        sources: {type: string, enum: [none, doctolib, jameda, both], default: doctolib}
        specialitySlug: {type: string, default: "", description: "Doctolib speciality (`…/appointments/doctolib-specialities`)."}
        specialityLabel: {type: string, default: ""}
        jamedaSpecialitySlug: {type: string, default: "", description: "jameda term (`…/appointments/jameda-terms`)."}
        jamedaSpecialityLabel: {type: string, default: ""}
        jamedaSpecialityType: {type: string, enum: [specialization, leistung, erkrankung], default: leistung}
        jamedaInsuranceType: {type: string, enum: ["", government, private, public_selfpay], default: ""}
        jamedaKidsFriendly: {type: boolean, default: false}
        jamedaVideo: {type: string, enum: [any, only, exclude], default: any}
        latitude: {type: string, minLength: 1}
        longitude: {type: string, minLength: 1}
        locationLabel: {type: string, default: ""}
        insuranceSector: {type: string, enum: ["", public, private], default: ""}
        dayLimit: {type: integer, minimum: 1, maximum: 365, default: 14, description: "Look this many days ahead."}
        maxPages: {type: integer, minimum: 1, maximum: 20, default: 3}
        enabled: {type: boolean, default: true}
        scheduleType: {type: string, enum: [MINUTES, HOURLY, DAILY, CRON], default: MINUTES}
        scheduleMinutes: {type: [integer, "null"], minimum: 1, maximum: 1440, default: 30}
        cron: {type: string, maxLength: 100, default: ""}
        notifyOnlyEarlier: {type: boolean, default: false, description: "Notify only when a slot is earlier than any seen before."}
        notifyApp: {type: boolean, description: "Also push to the members' app devices (new searches: true; an edit without it keeps it)."}
        channelIds:
          type: array
          default: []
          description: Notification channels for its finds.
          items: {type: string}
    RunSummary:
      type: object
      required: [id, status, startedAt, finishedAt, errorMessage, doctorsFound, doctorsMatched, slotsFound, notified, triggeredBy]
      properties:
        id: {type: string}
        status: {type: string, enum: [RUNNING, OK, NO_AVAILABILITY, ERROR], description: "Interrupted runs are marked when the worker restarts."}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: [string, "null"], format: date-time}
        errorMessage: {type: string}
        doctorsFound: {type: integer}
        doctorsMatched: {type: integer}
        slotsFound: {type: integer}
        notified: {type: boolean}
        triggeredBy: {type: string, enum: [SCHEDULE, MANUAL]}
    DoctorSlot:
      type: object
      description: The earliest slot a run found at a doctor.
      required: [resultId, doctorName, doctorSubtitle, speciality, practiceName, motiveLabel, bookingUrl, slot, isNextSlot, practiceAddress, practiceCity, practiceZipcode, practiceLatitude, practiceLongitude, source]
      properties:
        resultId: {type: integer}
        doctorName: {type: string}
        doctorSubtitle: {type: string}
        speciality: {type: string}
        practiceName: {type: string}
        motiveLabel: {type: string, description: "The visit reason."}
        bookingUrl: {type: string, description: "Where to book (Doctolib / jameda)."}
        slot: {type: string, format: date-time}
        isNextSlot: {type: boolean, description: "The provider only told the next free slot (beyond `dayLimit`)."}
        practiceAddress: {type: string}
        practiceCity: {type: string}
        practiceZipcode: {type: string}
        practiceLatitude: {type: string}
        practiceLongitude: {type: string}
        source: {type: string, enum: [doctolib, jameda]}
    IgnoredItem:
      type: object
      required: [id, doctorName, motiveLabel, providerSlug, motiveId]
      properties:
        id: {type: integer}
        doctorName: {type: string}
        motiveLabel: {type: string}
        providerSlug: {type: string}
        motiveId: {type: integer}
    Search:
      type: object
      description: A search with its schedule and the latest run's finds.
      required: [id, name, sources, specialitySlug, specialityLabel, jamedaSpecialitySlug, jamedaSpecialityLabel, jamedaSpecialityType, jamedaInsuranceType, jamedaKidsFriendly, jamedaVideo, locationLabel, latitude, longitude, insuranceSector, dayLimit, maxPages, enabled, scheduleType, scheduleMinutes, cron, notifyOnlyEarlier, notifyApp, lastRunAt, lastStatus, nextRunAt, runRequested, channelIds, latestRun, doctors, ignored]
      properties:
        id: {type: string}
        name: {type: string}
        sources: {type: string, enum: [none, doctolib, jameda, both]}
        specialitySlug: {type: string}
        specialityLabel: {type: string}
        jamedaSpecialitySlug: {type: string}
        jamedaSpecialityLabel: {type: string}
        jamedaSpecialityType: {type: string}
        jamedaInsuranceType: {type: string}
        jamedaKidsFriendly: {type: boolean}
        jamedaVideo: {type: string}
        locationLabel: {type: string}
        latitude: {type: string}
        longitude: {type: string}
        insuranceSector: {type: string}
        dayLimit: {type: integer}
        maxPages: {type: integer}
        enabled: {type: boolean}
        scheduleType: {type: string, enum: [MINUTES, HOURLY, DAILY, CRON]}
        scheduleMinutes: {type: [integer, "null"]}
        cron: {type: string}
        notifyOnlyEarlier: {type: boolean}
        notifyApp: {type: boolean}
        lastRunAt: {type: [string, "null"], format: date-time}
        lastStatus: {type: string, description: "The latest run's status (\"\" before the first)."}
        nextRunAt: {type: [string, "null"], format: date-time}
        runRequested: {type: boolean, description: "\"Run now\" was asked for and the worker hasn't started it yet."}
        channelIds:
          type: array
          items: {type: string}
        latestRun:
          oneOf:
            - $ref: "#/components/schemas/RunSummary"
            - type: "null"
        doctors:
          type: array
          description: Earliest slot per doctor of the latest run, earliest first.
          items: {$ref: "#/components/schemas/DoctorSlot"}
        ignored:
          type: array
          items: {$ref: "#/components/schemas/IgnoredItem"}
    RunWithResults:
      type: object
      required: [run, doctors]
      properties:
        run: {$ref: "#/components/schemas/RunSummary"}
        doctors:
          type: array
          items: {$ref: "#/components/schemas/DoctorSlot"}
    SlotDetail:
      type: object
      required: [slot, searchId, searchName, specialityLabel, insuranceSector, homeLat, homeLng, booking, searchEnabled, people, suggestedPerson]
      properties:
        slot: {$ref: "#/components/schemas/DoctorSlot"}
        searchId: {type: string}
        searchName: {type: string}
        specialityLabel: {type: string}
        insuranceSector: {type: string}
        homeLat: {type: [number, "null"]}
        homeLng: {type: [number, "null"]}
        booking:
          type: [object, "null"]
          description: The booking of this slot, if it was marked as booked.
          required: [eventId, date, start, end, person]
          properties:
            eventId: {type: string}
            date: {type: string, format: date}
            start: {type: [string, "null"]}
            end: {type: [string, "null"]}
            person: {type: string}
        searchEnabled: {type: boolean}
        people:
          type: array
          items: {type: string}
        suggestedPerson:
          type: string
          description: >-
            Whom a booking is likely for: the person of the search's latest booking, else the one
            name of `people` the search's name holds as a word, else the only name; "" otherwise.
    BookingInput:
      type: object
      required: [date, start]
      properties:
        date: {type: string, format: date, description: "The day as booked (the slot's, unless the practice gave another)."}
        start: {type: string, description: "HH:MM"}
        end: {type: [string, "null"], description: "HH:MM"}
        person: {type: string, maxLength: 80, default: ""}
        note: {type: string, maxLength: 1000, default: ""}
        stopSearch: {type: boolean, default: false, description: "Turn the search off (the family has its appointment)."}

    # ---------------------------------------------------------------- assistant
    AiSettingsEditor:
      type: object
      description: The settings as editors see them.
      required: [configured, canEdit, baseUrl, model, hasKey, keyHint, searchProvider, hasSearchKey, searchKeyHint, allowWrites, contextWindow, imageModel, serverReady]
      properties:
        configured: {type: boolean, description: "`baseUrl` and `model` are set."}
        canEdit: {type: boolean, const: true}
        baseUrl: {type: string, description: "An OpenAI-compatible API base URL."}
        model: {type: string}
        hasKey: {type: boolean}
        keyHint: {type: string, description: "The key's last four characters."}
        searchProvider: {type: string, enum: [none, tavily, brave]}
        hasSearchKey: {type: boolean}
        searchKeyHint: {type: string}
        allowWrites: {type: boolean, description: "The assistant may change data (for editors)."}
        contextWindow: {type: integer, description: "Tokens; 0 = ask the endpoint."}
        imageModel: {type: string, description: '"" = no recipe photos.'}
        serverReady: {type: boolean}
    AiSettingsViewer:
      type: object
      description: The settings as viewers see them.
      required: [configured, canEdit, model, allowWrites, serverReady]
      properties:
        configured: {type: boolean}
        canEdit: {type: boolean, const: false}
        model: {type: string}
        allowWrites: {type: boolean, const: false}
        serverReady: {type: boolean}
    AiSettingsInput:
      type: object
      properties:
        baseUrl: {type: string, maxLength: 500}
        apiKey: {type: string, maxLength: 1000, description: '"" removes it.'}
        model: {type: string, maxLength: 200}
        imageModel: {type: string, maxLength: 200}
        searchProvider: {type: string, enum: [none, tavily, brave]}
        searchKey: {type: string, maxLength: 1000}
        allowWrites: {type: boolean}
        contextWindow: {type: integer, description: "0 (automatic) or 1000 to 10 000 000 tokens."}
    ChatPage:
      type: string
      enum: [overview, calendar, finance, meals, appointments, settings]
      description: The page a chat belongs to (what the user most likely means).
    Chat:
      type: object
      description: A chat's summary.
      required: [id, title, status, activity, usage, page, queued, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        status: {type: string, enum: [idle, running]}
        activity:
          description: What the running turn does now (null when idle).
          oneOf:
            - type: "null"
            - type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [thinking, writing, tool, compacting]}
            - type: object
              required: [kind, attempt, max]
              properties:
                kind: {type: string, const: retrying}
                attempt: {type: integer}
                max: {type: integer}
        usage:
          type: [object, "null"]
          description: How full the model's context is.
          required: [used, max]
          properties:
            used: {type: integer}
            max: {type: integer}
        page:
          oneOf:
            - $ref: "#/components/schemas/ChatPage"
            - type: "null"
        queued:
          type: array
          description: Messages that wait for the running turn.
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
              attachments:
                type: array
                items:
                  type: object
                  required: [kind, name]
                  properties:
                    kind: {type: string, enum: [image, file]}
                    name: {type: string}
        updatedAt: {type: string, format: date-time}
    ChatAttachment:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [image, file]}
        name: {type: string}
        url: {type: string, description: "An image's data URL."}
    UndoStep:
      type: object
      description: >-
        A request on this family's API that undoes (part of) a change: send `method` to
        `/api/v1/families/{familyId}{path}` with `body`, in order.
      required: [method, path]
      properties:
        method: {type: string, enum: [POST, PATCH, DELETE]}
        path: {type: string, example: /entries}
        body: {}
    ChatItem:
      description: What the chat shows, in order.
      oneOf:
        - type: object
          title: user
          required: [kind, text]
          properties:
            kind: {type: string, const: user}
            text: {type: string}
            attachments:
              type: array
              items: {$ref: "#/components/schemas/ChatAttachment"}
        - type: object
          title: assistant
          required: [kind, text]
          properties:
            kind: {type: string, const: assistant}
            text: {type: string, description: "Markdown; grows while streaming."}
        - type: object
          title: tool
          required: [kind, id, name, args, status]
          properties:
            kind: {type: string, const: tool}
            id: {type: string}
            name: {type: string}
            args: {}
            status: {type: string, enum: [running, ok, error]}
            summary: {type: string}
            result: {type: string, description: "The start of what the model got back."}
            interrupted: {type: boolean}
        - type: object
          title: change
          required: [kind, id, change, summary, undo]
          properties:
            kind: {type: string, const: change}
            id: {type: string}
            change: {type: string, description: "What changed: entries, notes, types, transactions, recipes, …"}
            summary: {type: string}
            undo:
              type: array
              items: {$ref: "#/components/schemas/UndoStep"}
            undone: {type: boolean}
        - type: object
          title: question
          required: [kind, id, question, options, multiple]
          properties:
            kind: {type: string, const: question}
            id: {type: string}
            question: {type: string}
            options:
              type: array
              items: {type: string}
            multiple: {type: boolean}
            answer:
              type: object
              required: [selected]
              properties:
                selected:
                  type: array
                  items: {type: string}
                text: {type: string}
            skipped: {type: boolean}
        - type: object
          title: compacted
          required: [kind]
          properties:
            kind: {type: string, const: compacted, description: "The older part of the chat was condensed for the model from here on."}
        - type: object
          title: error
          required: [kind, text]
          properties:
            kind: {type: string, const: error}
            text: {type: string}
    ChatItemsEvent:
      type: object
      description: Data of the `items` stream event.
      required: [rev, items]
      properties:
        rev: {type: integer}
        items:
          type: array
          items:
            type: object
            required: [seq, item]
            properties:
              seq: {type: integer, description: "The item's index in the chat."}
              item: {$ref: "#/components/schemas/ChatItem"}
    ChatContextInput:
      type: object
      description: Where the user is (the instructions depend on it); the server's day as a fallback.
      properties:
        page: {$ref: "#/components/schemas/ChatPage"}
        year: {type: integer, description: "The calendar year the user looks at."}
        lang: {type: string, enum: [en, de], default: en}
        today: {type: string, format: date, description: "The user's day."}
    ChatMessageInput:
      allOf:
        - $ref: "#/components/schemas/ChatContextInput"
        - type: object
          description: A message needs `text` or an attachment.
          properties:
            text: {type: string, maxLength: 20000}
            attachments:
              type: array
              maxItems: 4
              items:
                oneOf:
                  - type: object
                    required: [kind, url]
                    properties:
                      kind: {type: string, const: image}
                      name: {type: string, maxLength: 200}
                      url: {type: string, description: "A data URL (`data:image/png;base64,…`)."}
                  - type: object
                    required: [kind, text]
                    properties:
                      kind: {type: string, const: file}
                      name: {type: string, maxLength: 200}
                      text: {type: string, description: "The file's text."}
