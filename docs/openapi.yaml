          description: The new search's id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IdObject"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/appointments/searches/{searchId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - $ref: "#/components/parameters/SearchId"
    get:
      tags: [Appointments]
      operationId: getSearch
      summary: A search with its latest finds and the home address
      x-ohana-role: viewer
      responses:
        "200":
          description: The search.
          content:
            application/json:
              schema:
                type: object
                required: [search, home]
                properties:
                  search: {$ref: "#/components/schemas/Search"}
