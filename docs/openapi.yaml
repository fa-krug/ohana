openapi: 3.1.0
info:
  title: Ohana API
  version: "1"
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  summary: The JSON API of a self-hosted Ohana server (calendar, finance, meals, appointments, assistant).
  description: |
    Ohana is one app for a family: a calendar, finances, meals, doctor appointments and an AI
    assistant. A server holds any number of **families**; every piece of data belongs to one.
    The native app (`apple/`) is the reference client of this API.

    ## Signing in

    * **API token** (`bearerAuth`): `Authorization: Bearer <token>`. Tokens are created by
      pairing the app (`/device/pair` opens in a browser and redirects to
      `ohana://auth-callback?token=…`) or with `POST /api/v1/me/tokens`. The account routes
      (`/api/v1/me…`, `/api/v1/admin/…`, `/api/v1/invites/…`, `POST /api/v1/families`) accept
      **only** an API token.
    * **Session cookie** (`cookieAuth`): `ohana_session`, set by the server's sign-in pages.
      The family routes accept it too. A request authenticated by the cookie that changes
      something (any method but GET/HEAD) must be same-origin (`Origin` / `Referer` of the
      server), otherwise 403 "Cross-origin request rejected".
    * An `Authorization` header with an unknown or expired token is a 401 on the family API
      (it does not fall back to the cookie).
    * An account created by an administrator that has not set its password yet
      (`onboardingStep: SET_CREDENTIALS`) gets 403 "Set your password first".

    ## Families and roles

    A user is a member of a family as an **editor** (reads and changes everything) or a
    **viewer** (reads everything). A family always keeps at least one editor. Being a server
    administrator does **not** open a family's data: the admin routes manage accounts and
    memberships only. Each operation states the role it needs in `x-ohana-role`
    (`public`, `token` = any signed-in account, `viewer` = any member, `editor`, `admin`).

    ## Modules

    The calendar is always on. A server may turn off `finance`, `meals`, `appointments` and
    `assistant` (`DISABLED_MODULES`); `GET /api/v1/server` lists the enabled ones, and the
    routes of a disabled module answer 404.

    ## Errors and status codes

    * The family API (`/api/v1/families/{familyId}/…` handled by the family dispatcher) and the
      account routes (`/api/v1/me/…`, `/api/v1/admin/…`, `/api/v1/invites/…`) answer errors as
      `{ "error": "<message>" }`.
    * `GET`/`DELETE /api/v1/me`, `POST /api/v1/families` and the separate family routes
      (`/recipes`, `/recipes/{id}`, `/recipes/generate`, `/shopping/toggle`, `/geocode`,
      `/appointments/doctolib-specialities`, `/appointments/jameda-terms`) answer errors as
      `{ "message": "<message>" }`.
    * `400` invalid input (the first validation problem), `401` not signed in, `403` a viewer
      asks for a change ("You can only view this family") or a cross-origin cookie write,
      `404` no such thing **or not a member of the family** (ids reveal nothing) or a disabled
      module, `405` a known path with another method, `409` a conflict (e.g. a chat that is
      still answering), `429` too many failed password checks, `502`/`503` an outside service
      (AI endpoint, notification provider) failed.
    * Dates are `YYYY-MM-DD` (calendar days, no time zone); timestamps are ISO 8601 strings.
      Money is integer **cents**.

    ## Undo

    Several changes return undo information instead of keeping a history on the server:
    finance transaction ops return `inverse` (ops for the same endpoint that put everything
    back), meal plan changes return `undo` (a body for `POST …/meals/plan/restore`), and the
    assistant's change items carry `undo` steps (requests on this family API the client
    replays).

    ## CORS

    The family API answers `OPTIONS` with 204 and allows any origin (`authorization`,
    `content-type` headers); the calendar feed is public.
servers:
  - url: https://{host}
    description: Your Ohana server
    variables:
      host:
        default: ohana.example.com
        description: Host name (and port) of the server.
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Server
    description: Server information and health.
  - name: Account
    description: The signed-in account (API token only).
  - name: Admin
    description: Server administration (administrators only; everyone else gets 404).
  - name: Invites
    description: Joining a family with an invite code.
  - name: Families
    description: Creating families, the family itself, its links and its export file.
  - name: Overview
    description: The family dashboard over all modules.
  - name: Search
    description: One search across the modules.
  - name: Household
    description: Members, people without an account, invites, home address and notifications.
  - name: Calendar
    description: Entry types per year, day entries, day notes and the iCalendar feed.
  - name: Events
    description: Timed events on calendar days (manual or booked appointments).
  - name: Finance
    description: Accounts, categories, transactions, imports and summaries (module `finance`).
  - name: Meals
    description: Recipes, tags, photos and AI recipe generation (module `meals`).
  - name: Meal plan
    description: The family's meal plan and its iterations (module `meals`).
  - name: Shopping
    description: Shopping lists of the meal plan (module `meals`).
  - name: Appointments
    description: Doctor appointment searches on Doctolib / jameda, their runs, results and bookings (module `appointments`).
  - name: Assistant
    description: The AI assistant's chats and agent instructions (module `assistant`).
  - name: AI settings
    description: The family's AI endpoint and the AI helpers (module `assistant`).
  - name: Media
    description: Recipe photos.

paths:
  # ------------------------------------------------------------------ server
  /api/v1/server:
    get:
      tags: [Server]
      operationId: getServerInfo
      summary: Server name, version, API version and enabled modules
      description: >-
        Public. Clients should refuse a server whose `apiVersion` is older than they need and
        hide modules that are not listed. Changes to API version 1 only add.
      security: []
      x-ohana-role: public
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerInfo"}
  /api/health:
    get:
      tags: [Server]
      operationId: getHealth
      summary: Liveness check
      security: []
      x-ohana-role: public
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}

  # ------------------------------------------------------------------ media
  /api/images/{path}:
    get:
      tags: [Media]
      operationId: getRecipeImage
      summary: A recipe photo (WebP)
      description: >-
        `path` is a recipe's `image` value (e.g. `recipes/<id>_<ts>.webp`, slashes included).
        Only members of the recipe's family get it; everyone else gets 404. Paths are unique
        per upload and cached privately for a year. Errors are plain text.
      x-ohana-role: viewer
      parameters:
        - name: path
          in: path
          required: true
          description: The recipe's `image` path (may contain `/`).
          schema: {type: string}
          example: recipes/0b6c…_1730000000000.webp
      responses:
        "200":
          description: The image.
          content:
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
        "401":
          description: Not signed in (plain text).
          content:
            text/plain:
              schema: {type: string}
        "404":
          description: No such image, or not a member of its family (plain text).
          content:
            text/plain:
              schema: {type: string}

  # ------------------------------------------------------------------ account
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The token's user and their families
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: The user and the families they belong to (by name).
          content:
            application/json:
              schema:
                type: object
                required: [user, families]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  families:
                    type: array
                    items: {$ref: "#/components/schemas/FamilySummary"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
    delete:
      tags: [Account]
      operationId: signOutToken
      summary: Sign out (deletes the calling API token)
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
  /api/v1/me/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: User, passkeys, API tokens and the number of signed-in browsers
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/me/profile:
    patch:
      tags: [Account]
      operationId: updateProfile
      summary: Change name and/or language
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 100}
                preferredLanguage: {type: string, enum: [en, de]}
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/me/email:
    put:
      tags: [Account]
      operationId: changeEmail
      summary: Change the email (needs the current password)
      description: >-
        Accounts without a password change their email on the server's account page (with a
        passkey). A wrong password counts as a failed sign-in (429 after too many).
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, currentPassword]
              properties:
                newEmail: {type: string, format: email}
                currentPassword: {type: string}
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/me/password:
    put:
      tags: [Account]
      operationId: setPassword
      summary: Set or change the password
      description: >-
        `currentPassword` is required when a password is set already. Signs out every browser
        session; the calling token stays.
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: {type: string}
                newPassword: {type: string, minLength: 1}
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    delete:
      tags: [Account]
      operationId: removePassword
      summary: Remove the password (the account must have a passkey)
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: {type: string, minLength: 1}
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/me/passkeys:
    get:
      tags: [Account]
      operationId: listPasskeys
      summary: The account's passkeys
      description: Passkeys are added on the server's account page (a WebAuthn ceremony on its domain).
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200": {$ref: "#/components/responses/PasskeyList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/me/passkeys/{passkeyId}:
    parameters:
      - {name: passkeyId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Account]
      operationId: renamePasskey
      summary: Rename a passkey
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName]
              properties:
                deviceName: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PasskeyList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Account]
      operationId: deletePasskey
      summary: Delete a passkey (not the last way to sign in)
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200": {$ref: "#/components/responses/PasskeyList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/me/tokens:
    get:
      tags: [Account]
      operationId: listApiTokens
      summary: The account's API tokens
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: The tokens; `current` marks the calling one.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: {$ref: "#/components/schemas/ApiToken"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Account]
      operationId: createApiToken
      summary: Create an API token (shown once)
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        "200":
          description: The secret token (only now) and its list entry.
          content:
            application/json:
              schema:
                type: object
                required: [token, item]
                properties:
                  token: {type: string, description: "The secret; send it as `Authorization: Bearer <token>`."}
                  item: {$ref: "#/components/schemas/ApiToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/me/tokens/{tokenId}:
    delete:
      tags: [Account]
      operationId: deleteApiToken
      summary: Delete an API token (the calling one too, which signs it out)
      security: [{bearerAuth: []}]
      x-ohana-role: token
      parameters:
        - {name: tokenId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, signedOut]
                properties:
                  ok: {type: boolean, const: true}
                  signedOut: {type: boolean, description: "The deleted token was the calling one."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/me/sessions:
    get:
      tags: [Account]
      operationId: countSessions
      summary: Number of signed-in browsers
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer, minimum: 0}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      tags: [Account]
      operationId: signOutBrowsers
      summary: Sign out every browser session (API tokens stay)
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [ok, count]
                properties:
                  ok: {type: boolean, const: true}
                  count: {type: integer, description: "Sessions that were open."}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/me/push:
    description: >-
      Push notifications to this device of the app (the calling API token) through the push
      relay (`GET /api/v1/server` → `push.relay`). The app registers with the relay, then gives
      the server the relay's token for it and a key for the payloads, which the server seals
      (AES-256-GCM: 12-byte IV + ciphertext + 16-byte tag, base64) so the relay sees only
      ciphertext. Signing out (deleting the token) removes the device. 404 when push is off on
      this server (`PUSH_RELAY_URL` empty).
    get:
      tags: [Account]
      operationId: getPushDevice
      summary: Whether this device gets push notifications
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: This device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushDevice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [Account]
      operationId: registerPushDevice
      summary: Register or renew this device for push notifications
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relay, relayToken, key, platform]
              properties:
                relay: {type: string, format: uri, description: "The relay the app registered with; must be this server's."}
                relayToken: {type: string, pattern: "^r1\\.[A-Za-z0-9_-]+$", maxLength: 2000}
                key: {type: string, description: "The device's AES-256 key (32 bytes), base64."}
                platform: {type: string, enum: [ios, macos]}
                mutedFamilyIds:
                  type: array
                  maxItems: 500
                  items: {type: string}
                  description: Families this device doesn't want pushes for (kept when left out).
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushDevice"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    patch:
      tags: [Account]
      operationId: mutePushFamilies
      summary: Choose the families this device doesn't want pushes for
      security: [{bearerAuth: []}]
      x-ohana-role: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutedFamilyIds]
              properties:
                mutedFamilyIds:
                  type: array
                  maxItems: 500
                  items: {type: string}
      responses:
        "200":
          description: This device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushDevice"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Account]
      operationId: unregisterPushDevice
      summary: Stop push notifications to this device
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: "Unregistered (`registered: false`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushDevice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/me/push/test:
    post:
      tags: [Account]
      operationId: testPushDevice
      summary: Send a test push to this device right away
      security: [{bearerAuth: []}]
      x-ohana-role: token
      responses:
        "200":
          description: The relay accepted it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushDevice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}

  # ------------------------------------------------------------------ admin
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: All accounts
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/AdminUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Create an account and its setup link
      description: The new account sets its password (or a passkey) with the setup link.
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, minLength: 1, description: "An email or a plain sign-in name (lowercased)."}
                name: {type: string, maxLength: 100, default: ""}
                isAdmin: {type: boolean, default: false}
      responses:
        "200":
          description: The account's id and setup link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SetupLink"
                  - type: object
                    required: [userId]
                    properties:
                      userId: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/admin/users/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Change an account's email, name or admin flag
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, minLength: 1}
                name: {type: string, maxLength: 100}
                isAdmin: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [Admin]
      operationId: adminDeleteUser
      summary: Delete an account (not oneself)
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/admin/users/{userId}/setup-link:
    post:
      tags: [Admin]
      operationId: adminResetUser
      summary: A new setup link for an account (signs it out everywhere)
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The setup link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupLink"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/admin/families:
    get:
      tags: [Admin]
      operationId: adminListFamilies
      summary: All families with their members
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      responses:
        "200":
          description: The families.
          content:
            application/json:
              schema:
                type: object
                required: [families]
                properties:
                  families:
                    type: array
                    items: {$ref: "#/components/schemas/AdminFamily"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Admin]
      operationId: adminCreateFamily
      summary: Create a family without members
      description: Its preset calendar types and finance categories are named in the admin's language.
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FamilyNameInput"}
      responses:
        "200":
          description: The new family's id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/admin/families/{familyId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    patch:
      tags: [Admin]
      operationId: adminRenameFamily
      summary: Rename a family
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FamilyNameInput"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Admin]
      operationId: adminDeleteFamily
      summary: Delete a family with all its data
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/admin/families/{familyId}/members:
    post:
      tags: [Admin]
      operationId: adminAddMember
      summary: Add an account to a family
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddMemberInput"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/admin/families/{familyId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: userId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Admin]
      operationId: adminSetRole
      summary: Change a member's role (a family keeps an editor)
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Admin]
      operationId: adminRemoveMember
      summary: Remove a member (a family keeps an editor)
      security: [{bearerAuth: []}]
      x-ohana-role: admin
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ invites
  /api/v1/invites/{code}:
    get:
      tags: [Invites]
      operationId: getInvite
      summary: What an invite is for
      description: An unknown, expired or used code is a 400.
      security: [{bearerAuth: []}]
      x-ohana-role: token
      parameters:
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "200":
          description: The invite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/invites/{code}/accept:
    post:
      tags: [Invites]
      operationId: acceptInvite
      summary: Join the family with the invite
      description: >-
        Makes the account a member with the invite's role. An invite for a person without an
        account replaces that person (the membership takes their birthday).
      security: [{bearerAuth: []}]
      x-ohana-role: token
      parameters:
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "200":
          description: The family as `GET /api/v1/me` lists it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FamilySummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # ------------------------------------------------------------------ families
  /api/v1/families:
    post:
      tags: [Families]
      operationId: createFamily
      summary: Create a family with the caller as its editor
      description: >-
        Adds the preset calendar types, finance categories and meal tags, named in the user's
        language (else the request's `Accept-Language`).
      security: [{bearerAuth: []}]
      x-ohana-role: token
      parameters:
        - {name: Accept-Language, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FamilyNameInput"}
      responses:
        "200":
          description: The family as `GET /api/v1/me` lists it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FamilySummary"}
        "400": {$ref: "#/components/responses/MessageBadRequest"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
  /api/v1/families/{familyId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Families]
      operationId: getFamily
      summary: The family with its calendar in a range
      description: >-
        All entry types of the range's years (`typeYears`: every year that has types), the
        entries and notes in the range, the timed events by day and the members' birthdays by
        day (only when the range has both ends, e.g. `?year=`). Without a range: everything.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200": {$ref: "#/components/responses/FamilyState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Families]
      operationId: renameFamily
      summary: Rename the family
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FamilyNameInput"}
      responses:
        "200": {$ref: "#/components/responses/FamilyState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/links:
    post:
      tags: [Families]
      operationId: rotateLink
      summary: A new calendar feed link, or remove the legacy link
      description: >-
        `feed`: a new `feedId` (the old feed URL stops working). `legacy`: removes the
        `legacyId` (family-planner's old view id). Answers like `GET /families/{familyId}`.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: {type: string, enum: [feed, legacy]}
      responses:
        "200": {$ref: "#/components/responses/FamilyState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/export:
    get:
      tags: [Families]
      operationId: exportFamily
      summary: The family as an export file (calendar and finances)
      description: >-
        All years, types, entries, notes and the finances, without the family's ids. Sent with
        `Content-Disposition: attachment` and `Cache-Control: no-store`. Viewers may export.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: The export file.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExportFile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/import:
    post:
      tags: [Families]
      operationId: importFamily
      summary: Replace the calendar (and finances) with an export file
      description: >-
        Replaces all years, types, entries and notes, and the finances if the file has them
        (version 2), all or nothing. The name and links stay. Answers like
        `GET /families/{familyId}` with the range given.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportFile"}
      responses:
        "200": {$ref: "#/components/responses/FamilyState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ overview
  /api/v1/families/{familyId}/overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: The family dashboard
      description: >-
        Today (meal or away, today's events), what comes up in the next 30 days, the shopping
        list, this month's finances, the appointment searches' latest finds and the birthdays
        of the next 30 days. A disabled module's part is empty.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - name: today
          in: query
          description: The client's day (default the server's UTC day).
          schema: {type: string, format: date}
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ search
  /api/v1/families/{familyId}/search:
    get:
      tags: [Search]
      operationId: search
      summary: Search across the modules
      description: >-
        Recipes, calendar events and notes, transactions, appointment searches, the people of
        the family and the caller's own assistant chats whose text holds every word of `q`
        (case and accents ignored). Grouped by kind in the order of `SearchHit.kind`; within a
        kind title matches first, then the ones nearest to `today`. Disabled modules are left
        out.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - name: q
          in: query
          description: What to look for (at most 100 characters; empty finds nothing).
          schema: {type: string}
        - name: today
          in: query
          description: The client's day (default the server's UTC day).
          schema: {type: string, format: date}
        - name: limit
          in: query
          description: Hits per kind (1–50, default 8).
          schema: {type: integer, minimum: 1, maximum: 50}
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ household
  /api/v1/families/{familyId}/household:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Household]
      operationId: getHousehold
      summary: Members, people, invites, home address, channels and notification events
      x-ohana-role: viewer
      responses:
        "200":
          description: The household.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Household"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Household]
      operationId: deleteFamily
      summary: Delete the family (its only member)
      description: An editor who is the family's only member; otherwise 400 (ask an administrator).
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/members:
    post:
      tags: [Household]
      operationId: addMember
      summary: Add an existing account by its sign-in name
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddMemberInput"}
      responses:
        "201":
          description: The member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/families/{familyId}/household/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: userId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Household]
      operationId: updateMember
      summary: Change a member's role and/or birthday
      description: >-
        `role` needs an editor (a family keeps an editor). Members set their own `birthday`,
        editors anyone's; `null` or `""` clears it. A field that is left out stays.
      x-ohana-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {$ref: "#/components/schemas/Role"}
                birthday: {$ref: "#/components/schemas/BirthdayInput"}
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Household]
      operationId: removeMember
      summary: Remove a member, or leave (oneself)
      description: Everyone may remove themselves; editors anyone. The only member can't leave.
      x-ohana-role: viewer
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/people:
    post:
      tags: [Household]
      operationId: addPerson
      summary: Add a member without an account (optionally with an invite)
      description: >-
        Names are unique per family. With `invite` (a role), an invite for that person is
        created: whoever accepts it becomes the member in their place.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                birthday: {$ref: "#/components/schemas/BirthdayInput"}
                invite:
                  oneOf:
                    - $ref: "#/components/schemas/Role"
                    - type: "null"
                  default: null
      responses:
        "201":
          description: The person, and the invite if one was asked for.
          content:
            application/json:
              schema:
                type: object
                required: [person, invite]
                properties:
                  person: {$ref: "#/components/schemas/Person"}
                  invite:
                    oneOf:
                      - $ref: "#/components/schemas/CreatedInvite"
                      - type: "null"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/families/{familyId}/household/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: personId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Household]
      operationId: updatePerson
      summary: Rename a person or set their birthday
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                birthday: {$ref: "#/components/schemas/BirthdayInput"}
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Person"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [Household]
      operationId: removePerson
      summary: Remove a person
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/invites:
    post:
      tags: [Household]
      operationId: createInvite
      summary: Create an invite link (valid 7 days)
      description: With `personId` the invite is for that person without an account (an older open invite for them is replaced).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: "#/components/schemas/Role"}
                personId: {type: [string, "null"], minLength: 1}
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedInvite"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/invites/{inviteId}:
    delete:
      tags: [Household]
      operationId: revokeInvite
      summary: Revoke an invite
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: inviteId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/home:
    put:
      tags: [Household]
      operationId: setHomeAddress
      summary: Set or clear the home address
      description: >-
        Pick the coordinates with `GET …/geocode`. An empty `address` (or a null coordinate)
        clears it. Used for distances to practices and by the assistant.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, lat, lng]
              properties:
                address: {type: string, maxLength: 300}
                lat: {type: [number, "null"], minimum: -90, maximum: 90}
                lng: {type: [number, "null"], minimum: -180, maximum: 180}
      responses:
        "200":
          description: The stored address.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HomeAddress"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/notifications/channels:
    post:
      tags: [Household]
      operationId: createChannel
      summary: Add a notification channel
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/notifications/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: channelId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Household]
      operationId: updateChannel
      summary: Change a notification channel
      description: >-
        The whole channel is sent (fields left out take their defaults); a blank `token`
        keeps the stored one.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Household]
      operationId: deleteChannel
      summary: Delete a notification channel
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/household/notifications/channels/{channelId}/test:
    post:
      tags: [Household]
      operationId: testChannel
      summary: Send a test message now (also on a disabled channel)
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: channelId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/v1/families/{familyId}/household/notifications/events/{event}:
    put:
      tags: [Household]
      operationId: setNotificationEvent
      summary: Turn a notification event on or off and pick its channels
      description: >-
        `channelIds: null` sends to all of the family's enabled channels. `appointment_found`
        ignores `channelIds` (each search picks its own channels: `hasChannels: false`).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - name: event
          in: path
          required: true
          schema: {$ref: "#/components/schemas/NotifyEvent"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, channelIds]
              properties:
                enabled: {type: boolean}
                channelIds:
                  type: [array, "null"]
                  maxItems: 50
                  items: {type: string}
                app: {type: boolean, description: "Also push to the members' app devices (kept when left out)."}
      responses:
        "200":
          description: The event's setting.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPref"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ calendar
  /api/v1/families/{feedId}/calendar.ics:
    get:
      tags: [Calendar]
      operationId: getCalendarFeed
      summary: The family's calendar as an iCalendar feed (public)
      description: >-
        Looked up by the family's **feed id** (`feedId` of the family; or the legacy id of a
        planner from before families), never by the family id. Needs no sign-in; anyone with
        the link can read it, so rotate it with `POST …/links`. Entries become all-day events
        per run of days. Cached for 5 minutes.
      security: []
      x-ohana-role: public
      parameters:
        - name: feedId
          in: path
          required: true
          description: The family's `feedId` (or `legacyId`).
          schema: {type: string, pattern: "^[A-Za-z0-9]{10,64}$"}
        - name: types
          in: query
          description: Comma-separated entry types (ids or names, in every year) to include; default all. An unknown one is a 404.
          schema: {type: string}
        - name: notes
          in: query
          description: "`1` adds the day notes."
          schema: {type: string, enum: ["1"]}
        - name: gaps
          in: query
          description: "`1` adds the coverage gaps (weekdays not covered)."
          schema: {type: string, enum: ["1"]}
        - name: events
          in: query
          description: "`1` adds the timed events (booked appointments etc., floating local times)."
          schema: {type: string, enum: ["1"]}
        - name: birthdays
          in: query
          description: "`1` adds the members' birthdays (yearly events)."
          schema: {type: string, enum: ["1"]}
        - name: lang
          in: query
          description: Language of generated texts.
          schema: {type: string, enum: [en, de], default: en}
        - name: name
          in: query
          description: The calendar's name (default the family's name).
          schema: {type: string}
      responses:
        "200":
          description: The calendar.
          content:
            text/calendar:
              schema: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/types:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Calendar]
      operationId: listEntryTypes
      summary: The entry types of a year
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/TypeYear"
      responses:
        "200":
          description: The year's types.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/EntryType"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Calendar]
      operationId: createEntryType
      summary: Add an entry type to a year (max. 50 per year)
      description: The id is made from the name. The year is `?year=`, else the body's `year`, else the current year.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/TypeYear"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                year: {type: [integer, string], description: "YYYY"}
                name: {type: string, minLength: 1, maxLength: 80}
                color: {$ref: "#/components/schemas/Color"}
                role: {$ref: "#/components/schemas/EntryTypeRole"}
                away: {type: boolean, default: false}
      responses:
        "201":
          description: The type.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntryType"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/types/copy:
    post:
      tags: [Calendar]
      operationId: copyEntryTypes
      summary: Copy a year's types into another year
      description: Types the target year has already (by id) are kept; answers the target year's types.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: [integer, string], description: "YYYY"}
                to: {type: [integer, string], description: "YYYY"}
      responses:
        "200":
          description: The target year's types.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/EntryType"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/types/{typeId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - name: typeId
        in: path
        required: true
        description: The type's id or (case-insensitive) name in that year.
        schema: {type: string}
      - $ref: "#/components/parameters/TypeYear"
    patch:
      tags: [Calendar]
      operationId: updateEntryType
      summary: Change an entry type
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                year: {type: [integer, string], description: "YYYY (when not in the query)"}
                name: {type: string, minLength: 1, maxLength: 80}
                color: {$ref: "#/components/schemas/Color"}
                role: {$ref: "#/components/schemas/EntryTypeRole"}
                away: {type: boolean}
                position: {type: integer}
      responses:
        "200":
          description: The type.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntryType"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Calendar]
      operationId: deleteEntryType
      summary: Delete an entry type with its entries
      x-ohana-role: editor
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, year]
                properties:
                  deleted: {type: string, description: "The type's id."}
                  year: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/entries:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Calendar]
      operationId: listEntries
      summary: The entries by day
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: Day → type ids.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EntriesByDay"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Calendar]
      operationId: changeEntries
      summary: Add, remove, set or clear entries (ops)
      description: >-
        `{ "ops": [...] }` or a single op. Ops run in order; at most 4000 days per request.
        Types are resolved per year (each year has its own types).
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ops]
                  properties:
                    ops:
                      type: array
                      items: {$ref: "#/components/schemas/EntryOp"}
                - $ref: "#/components/schemas/EntryOp"
      responses:
        "200": {$ref: "#/components/responses/OpsResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/notes:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Calendar]
      operationId: listNotes
      summary: The day notes by day
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: Day → note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotesByDay"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Calendar]
      operationId: changeNotes
      summary: Set or clear day notes (ops)
      description: "`{ \"ops\": [...] }` or a single op; at most 4000 days per request."
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ops]
                  properties:
                    ops:
                      type: array
                      items: {$ref: "#/components/schemas/NoteOp"}
                - $ref: "#/components/schemas/NoteOp"
      responses:
        "200": {$ref: "#/components/responses/OpsResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ events
  /api/v1/families/{familyId}/events:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Events]
      operationId: listEvents
      summary: Timed events in a range
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/RangeYear"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The events by day and start (all-day first).
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/Event"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Events]
      operationId: createEvent
      summary: Add an event
      description: >-
        With `searchId` and `resultId` the event is that appointment search's booking of the
        slot again (how the assistant's undo puts a booking back); the search must be the
        family's.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventInput"
                - type: object
                  properties:
                    searchId: {type: string}
                    resultId: {type: [integer, string]}
      responses:
        "201":
          description: The event.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Event"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: eventId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Change an event in place
      description: >-
        Only the fields given change (those of `POST /events`). `start`/`end` `null` clear them;
        clearing `start` clears the end too. The source (manual or booked appointment) stays.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EventPatch"}
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Event"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete an event
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ finance
  /api/v1/families/{familyId}/finance:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Finance]
      operationId: getFinance
      summary: Currency, CSV mappings, benchmark, categories and accounts
      x-ohana-role: viewer
      responses:
        "200": {$ref: "#/components/responses/FinanceOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Finance]
      operationId: clearFinance
      summary: Delete all transactions, accounts, categories and settings
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/FinanceOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/settings:
    patch:
      tags: [Finance]
      operationId: updateFinanceSettings
      summary: Change currency, CSV mappings, benchmark or groceries category
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: {type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217 code."}
                csvMappings:
                  type: array
                  maxItems: 20
                  description: The client's saved CSV column mappings (stored as given, max. 20 000 characters of JSON).
                  items: {type: object, additionalProperties: true}
                benchmark:
                  oneOf:
                    - $ref: "#/components/schemas/BenchmarkInput"
                    - type: "null"
                  description: "`null` (or one without any amount) clears it."
                groceriesCategoryId:
                  type: [string, "null"]
                  description: >-
                    The category whose spending the shopping lists show (id, name or path);
                    `null` or `""`: the default (the category named Groceries / Lebensmittel).
      responses:
        "200": {$ref: "#/components/responses/FinanceOverview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/categories:
    post:
      tags: [Finance]
      operationId: createCategory
      summary: Add a category (max. 250)
      description: A subcategory takes the kind of its top-level category. The id is made from the name.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CategoryInput"}
      responses:
        "201":
          description: The category.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Category"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/categories/defaults:
    post:
      tags: [Finance]
      operationId: addDefaultCategories
      summary: Add the default categories the family doesn't have yet
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lang: {type: string, enum: [en, de], default: en}
      responses:
        "200":
          description: All categories.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Category"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - name: categoryId
        in: path
        required: true
        description: Id, (case-insensitive) name, or path like `Food > Groceries`.
        schema: {type: string}
    patch:
      tags: [Finance]
      operationId: updateCategory
      summary: Change or move a category
      description: >-
        `parentId` moves it with its subcategories (not into itself); `null`/`""` makes it
        top-level. Only a top-level category's `kind` can be set; its subcategories follow.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Category"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Finance]
      operationId: deleteCategory
      summary: Delete a category
      description: Its subcategories move to its parent; its transactions lose the category.
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/accounts:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Finance]
      operationId: listAccounts
      summary: The accounts with their balances (now, or at the end of a day)
      x-ohana-role: viewer
      parameters:
        - name: at
          in: query
          schema: {type: string, format: date}
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [at, accounts]
                properties:
                  at: {type: [string, "null"], format: date}
                  accounts:
                    type: array
                    items: {$ref: "#/components/schemas/Account"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Finance]
      operationId: createAccount
      summary: Add an account (max. 50)
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                color: {$ref: "#/components/schemas/Color"}
                icon: {type: string, maxLength: 16}
                openingCents: {type: integer, default: 0}
      responses:
        "201":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - name: accountId
        in: path
        required: true
        description: Id or (case-insensitive) name.
        schema: {type: string}
    patch:
      tags: [Finance]
      operationId: updateAccount
      summary: Change an account
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                color: {$ref: "#/components/schemas/Color"}
                icon: {type: string, maxLength: 16}
                openingCents: {type: integer}
                position: {type: integer}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Finance]
      operationId: deleteAccount
      summary: Delete an account with its transactions
      description: A transfer's leg on another account stays (unlinked).
      x-ohana-role: editor
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, transactions]
                properties:
                  deleted: {type: string}
                  transactions: {type: integer, description: "Transactions deleted with it."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/transactions:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Finance]
      operationId: listTransactions
      summary: Transactions matching filters (newest first) with net totals
      description: >-
        `incomeCents` / `expenseCents` count the matching rows the net way: a transfer group
        is one item (a net-0 transfer is neither), a split booking counts by its parts.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - name: account
          in: query
          description: Account id or name, or `none` (without an account).
          schema: {type: string}
        - name: category
          in: query
          description: Category (with its subcategories) by id, name or path, or `none`.
          schema: {type: string}
        - name: q
          in: query
          description: Text in payee, description or note.
          schema: {type: string}
        - name: kind
          in: query
          schema: {type: string, enum: [income, expense, transfer]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                type: object
                required: [transactions, total, incomeCents, expenseCents]
                properties:
                  transactions:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
                  total: {type: integer, description: "All matching rows."}
                  incomeCents: {type: integer}
                  expenseCents: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Finance]
      operationId: changeTransactions
      summary: Add, update, delete, link, unlink, split or unsplit transactions (ops)
      description: >-
        `{ "ops": [...] }` or a single op (max. 2000), applied in order. The answer's
        `inverse` are the ops that undo the request: send them to this endpoint again.
        Transactions added by one request share a creation time and keep their order.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ops]
                  properties:
                    ops:
                      type: array
                      maxItems: 2000
                      items: {$ref: "#/components/schemas/TransactionOp"}
                - $ref: "#/components/schemas/TransactionOp"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionOpsResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/transfers/suggestions:
    get:
      tags: [Finance]
      operationId: suggestTransfers
      summary: Transaction pairs that look like transfers between accounts
      description: Link them with a `link` op. At most 200 pairs.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The pairs.
          content:
            application/json:
              schema:
                type: object
                required: [pairs]
                properties:
                  pairs:
                    type: array
                    items:
                      type: object
                      required: [out, in]
                      properties:
                        out: {$ref: "#/components/schemas/Transaction"}
                        in: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/transfers/auto:
    post:
      tags: [Finance]
      operationId: autoCombine
      summary: Combine split bookings and link transfer pairs automatically
      description: >-
        First the split bookings, then every suggested transfer pair in the range (both ends
        optional: all of the history). `inverse` undoes it.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from: {type: [string, "null"], format: date}
                to: {type: [string, "null"], format: date}
      responses:
        "200":
          description: Combined.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TransactionOpsResult"
                  - type: object
                    required: [linked, splits]
                    properties:
                      linked: {type: integer, description: "Transfer pairs linked."}
                      splits: {type: integer, description: "Split bookings combined."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/import:
    post:
      tags: [Finance]
      operationId: importTransactions
      summary: Import bank rows (duplicates are skipped)
      description: >-
        Adds the rows that weren't imported before (by a hash of the row and account), all to
        `accountId` if given (max. 5000 rows). `autoTransfers` combines fresh rows into split
        bookings and links them to the other leg of a transfer. `dryRun` only counts.
        Parse CSV files on the client.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    required: [date, amountCents]
                    properties:
                      date: {type: string, format: date}
                      amountCents: {type: integer}
                      payee: {type: string, maxLength: 200}
                      description: {type: string, maxLength: 500}
                      categoryId: {type: [string, "null"], description: "Id, name or path."}
                accountId: {type: [string, "null"], description: "Id or name."}
                autoTransfers: {type: boolean, default: false}
                dryRun: {type: boolean, default: false}
      responses:
        "200":
          description: What was (or would be) imported.
          content:
            application/json:
              schema:
                type: object
                required: [added, duplicates, ids, transfers, splits]
                properties:
                  added: {type: integer, description: "0 on a dry run."}
                  duplicates:
                    type: array
                    description: Indexes of rows imported before.
                    items: {type: integer}
                  ids:
                    type: array
                    description: Ids of the added transactions ([] on a dry run).
                    items: {type: string, format: uuid}
                  transfers: {type: integer}
                  splits: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/summary:
    get:
      tags: [Finance]
      operationId: financeSummary
      summary: Income and expenses per month and per category (net counting)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FinanceSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/finance/shopping-links:
    get:
      tags: [Finance]
      operationId: shoppingLinks
      summary: Groceries categories and shopping days (to link transactions to shopping lists)
      description: >-
        A transaction in one of `categoryIds` belongs to the shopping list whose `date` is
        nearest within ± 1 day (on a tie the earlier list).
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShoppingLinks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ meals
  /api/v1/families/{familyId}/meals/status:
    get:
      tags: [Meals]
      operationId: mealsStatus
      summary: Whether AI generation and photos are available, and the recipe count
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [generate, photos, recipeCount]
                properties:
                  generate: {type: boolean, description: "The family's AI is set up."}
                  photos: {type: boolean, description: "An image model is set too."}
                  recipeCount: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/catalog:
    get:
      tags: [Meals]
      operationId: mealsCatalog
      summary: The shared ingredient and unit lists
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200": {$ref: "#/components/responses/IngredientsAndUnits"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/tags:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Meals]
      operationId: listTags
      summary: The family's meal tags
      x-ohana-role: viewer
      responses:
        "200": {$ref: "#/components/responses/TagList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Meals]
      operationId: createTag
      summary: Add a meal tag
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, nameEn, nameDe]
              properties:
                category: {type: string}
                nameEn: {type: string, maxLength: 80}
                nameDe: {type: string, maxLength: 80}
      responses:
        "200": {$ref: "#/components/responses/IdResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/tags/reset:
    post:
      tags: [Meals]
      operationId: resetTags
      summary: Put back the default tags
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200": {$ref: "#/components/responses/TagList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: tagId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Meals]
      operationId: updateTag
      summary: Rename a meal tag
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nameEn, nameDe]
              properties:
                nameEn: {type: string, maxLength: 80}
                nameDe: {type: string, maxLength: 80}
      responses:
        "200": {$ref: "#/components/responses/IdResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Meals]
      operationId: deleteTag
      summary: Delete a meal tag
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/recipes:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [Meals]
      operationId: listRecipes
      summary: A page of recipes
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/RecipeList"
        - $ref: "#/components/parameters/RecipeQuery"
        - $ref: "#/components/parameters/RecipeSort"
        - name: locale
          in: query
          description: Name ordering.
          schema: {type: string, enum: [en, de], default: en}
        - $ref: "#/components/parameters/RecipeTags"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RecipeLimit"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecipeList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Meals]
      operationId: createRecipe
      summary: Add a recipe
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipeInput"}
      responses:
        "200": {$ref: "#/components/responses/IdResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/recipes/bulk:
    post:
      tags: [Meals]
      operationId: bulkCreateRecipes
      summary: Save generated recipes (the generator's picks)
      description: >-
        Ingredients are found or added by name, units by abbreviation; `imageBase64` becomes the
        photo.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipes]
              properties:
                recipes:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: "#/components/schemas/BulkRecipe"}
      responses:
        "200":
          description: The new recipes' ids.
          content:
            application/json:
              schema:
                type: object
                required: [createdIds]
                properties:
                  createdIds:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/recipes/import:
    post:
      tags: [Meals]
      operationId: importRecipe
      summary: Import a recipe from a web page with the family's AI
      description: >-
        The family's AI turns the page into one recipe in the user's language (the author's
        quantities and steps, units converted to the available ones, the family's tags) and saves it
        on the "to try" list, with `Source: <url>` at the end of its description. The page is read
        from `text` (the page's text or HTML as the browser had it; the share extension and
        Shortcuts send it) or, without one, fetched by the server (never from private addresses,
        also not after a redirect; 20 s). The photo is `imageUrl`, else the page's schema.org
        Recipe image or `og:image`; a photo that can't be loaded is left out. Waits for the model
        (up to two minutes). 400 when the AI isn't set up or the address is invalid or private,
        404 when the `assistant` or `meals` module is off.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri, description: "The page's address (http or https)."}
                text:
                  type: [string, "null"]
                  description: The page's readable text (or HTML, JSON-LD included) as the browser had it; cut after 100,000 characters. Without it (or under 100 characters) the server fetches the page.
                title: {type: [string, "null"], description: "The page's title as the browser had it."}
                imageUrl: {type: [string, "null"], format: uri, description: "The recipe's photo (http or https); anything else is ignored."}
      responses:
        "200":
          description: The saved recipe.
          content:
            application/json:
              schema:
                type: object
                required: [id, title]
                properties:
                  id: {type: string}
                  title: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: No recipe found on that page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/v1/families/{familyId}/meals/recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - $ref: "#/components/parameters/RecipeId"
    get:
      tags: [Meals]
      operationId: getRecipe
      summary: A recipe with the ingredients and units it uses
      x-ohana-role: viewer
      responses:
        "200": {$ref: "#/components/responses/RecipeWithNames"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Meals]
      operationId: saveRecipe
      summary: Save a recipe (the whole recipe)
      description: Replaces the recipe with the input; also puts a deleted recipe back with this id (assistant undo).
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipeInput"}
      responses:
        "200": {$ref: "#/components/responses/IdResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Meals]
      operationId: deleteRecipe
      summary: Delete a recipe
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/recipes/{recipeId}/move:
    post:
      tags: [Meals]
      operationId: moveRecipe
      summary: Move a recipe between the lists (KNOWN ⇄ TO_TRY)
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RecipeId"
      responses:
        "200":
          description: The new list.
          content:
            application/json:
              schema:
                type: object
                required: [listType]
                properties:
                  listType: {$ref: "#/components/schemas/RecipeListType"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/recipes/{recipeId}/image:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - $ref: "#/components/parameters/RecipeId"
    put:
      tags: [Meals]
      operationId: uploadRecipeImage
      summary: Upload a recipe photo (JPEG, PNG or WebP, max. 5 MB)
      description: >-
        The raw image as the body (with its `Content-Type`), or `multipart/form-data` with a
        file field `image`. Stored as WebP. `POST` does the same.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, contentMediaType: application/octet-stream}
      responses:
        "200": {$ref: "#/components/responses/ImageResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Meals]
      operationId: uploadRecipeImagePost
      summary: Upload a recipe photo (same as PUT)
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, contentMediaType: image/jpeg}
          image/png:
            schema: {type: string, contentMediaType: image/png}
          image/webp:
            schema: {type: string, contentMediaType: image/webp}
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, contentMediaType: application/octet-stream}
      responses:
        "200": {$ref: "#/components/responses/ImageResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Meals]
      operationId: deleteRecipeImage
      summary: Remove a recipe's photo
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/ImageResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/recipes/{recipeId}/image/generate:
    post:
      tags: [Meals]
      operationId: generateRecipeImage
      summary: Generate a photo with the family's image model
      description: Waits for the image model (can take a while); 400 when no image model is set, 404 when the `assistant` module is off.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RecipeId"
      responses:
        "200": {$ref: "#/components/responses/ImageResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}

  # ------------------------------------------------------------------ meal plan
  /api/v1/families/{familyId}/meals/plan:
