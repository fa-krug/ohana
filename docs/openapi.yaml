        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Appointments]
      operationId: updateSearch
      summary: Save a search (the whole search)
      description: Replaces the search's settings and reschedules it. Fields left out take their defaults.
      x-ohana-role: editor
