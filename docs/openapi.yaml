  /api/v1/families/{familyId}/meals/plan/setup:
    post:
      tags: [Meal plan]
      operationId: setupMealPlan
      summary: Set up the plan and make its first iteration
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetupPlanInput"}
      responses:
        "200":
          description: The new iteration.
          content:
            application/json:
              schema:
                type: object
                required: [iterationId]
                properties:
                  iterationId: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/plan/next:
    post:
      tags: [Meal plan]
      operationId: nextIteration
      summary: Start the next iteration
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200": {$ref: "#/components/responses/PlanChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/plan/iterations/{iterationId}/renew:
    post:
      tags: [Meal plan]
      operationId: renewIteration
      summary: Pick an iteration's meals anew
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: iterationId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/PlanChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/plan/iterations/{iterationId}/entries:
    post:
      tags: [Meal plan]
      operationId: addMeal
      summary: Put a recipe as the lunch on a day without one
      description: >-
        For a day of the iteration that has no lunch yet (an empty or away day): the meal gets the
        plan's servings. The iteration's shopping lists are made anew, keeping ticks and what was
        added by hand. A day that has a lunch answers 409 (swap it with PATCH
        `…/meals/plan/entries/{entryId}` instead).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: iterationId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, recipeId]
              properties:
                date: {type: string, format: date, description: "A day of the iteration (YYYY-MM-DD)."}
                recipeId: {type: string, minLength: 1, maxLength: 64}
      responses:
        "200": {$ref: "#/components/responses/PlanChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: The day is not in the iteration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/families/{familyId}/meals/plan/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: entryId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Meal plan]
      operationId: swapMeal
      summary: Swap a meal's recipe (its leftover days follow)
      description: >-
        A leftover day becomes a meal of its own. The iteration's shopping lists are made anew,
        keeping ticks and what was added by hand.
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipeId]
              properties:
                recipeId: {type: string, minLength: 1, maxLength: 64}
      responses:
        "200": {$ref: "#/components/responses/PlanChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Meal plan]
      operationId: removeMeal
      summary: Remove a meal (with its leftover days)
      description: The iteration's shopping lists are made anew, keeping ticks and what was added by hand.
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/PlanChange"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/plan/entries/{entryId}/move:
    post:
      tags: [Meal plan]
      operationId: moveMeal
      summary: Move a meal to another day of its iteration (the two days swap)
      description: >-
        The meal on that day, if any, takes the moved one's day. Afterwards a leftover day that
        lies on or before the day of its meal becomes a meal of its own. The iteration's shopping
        lists are made anew, keeping ticks and what was added by hand. The same day changes
        nothing and answers `undo: null`.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: entryId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: {type: string, format: date, description: "A day of the meal's iteration (YYYY-MM-DD)."}
      responses:
        "200":
          description: The changed iteration and the body that undoes the change (null if nothing changed).
          content:
            application/json:
              schema:
                type: object
                required: [iterationId, undo]
                properties:
                  iterationId: {type: string}
                  undo:
                    oneOf:
                      - $ref: "#/components/schemas/PlanUndo"
                      - type: "null"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: The day is not in the iteration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/families/{familyId}/meals/plan/restore:
    post:
      tags: [Meal plan]
      operationId: restorePlan
      summary: Undo a plan change (puts iterations back, removes added ones)
      description: The body is an `undo` from a plan change (or an assistant undo step).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanUndo"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ------------------------------------------------------------------ shopping
  /api/v1/families/{familyId}/meals/shopping:
    get:
      tags: [Shopping]
      operationId: shoppingOverview
      summary: All shopping lists (summaries) and the latest list
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ShoppingLang"
      responses:
        "200":
          description: The lists, newest shopping day first.
          content:
            application/json:
              schema:
                type: object
                required: [lists, latest]
                properties:
                  lists:
                    type: array
                    items: {$ref: "#/components/schemas/ShoppingListSummary"}
                  latest:
                    oneOf:
                      - $ref: "#/components/schemas/ShoppingList"
                      - type: "null"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/shopping/units:
    get:
      tags: [Shopping]
      operationId: shoppingUnits
      summary: All units
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      responses:
        "200":
          description: The units.
          content:
            application/json:
              schema:
                type: object
                required: [units]
                properties:
                  units:
                    type: array
                    items: {$ref: "#/components/schemas/Unit"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/shopping/lists/{listId}:
    get:
      tags: [Shopping]
      operationId: getShoppingList
      summary: A shopping list with its items
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ShoppingLang"
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [list]
                properties:
                  list: {$ref: "#/components/schemas/ShoppingList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/shopping/lists/{listId}/spent:
    get:
      tags: [Shopping]
      operationId: shoppingSpent
      summary: Groceries spending around the list's shopping day (± 1 day)
      description: 404 for a list without a shopping day.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ListId"
      responses:
        "200":
          description: The spending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShoppingSpend"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/shopping/lists/{listId}/items:
    post:
      tags: [Shopping]
      operationId: addShoppingItem
      summary: Add an item by name (merged with the same ingredient and unit)
      description: An unknown ingredient name is added to the shared ingredients (with `category`).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, quantity, unitId]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                quantity: {type: [string, number], description: "A positive decimal; `,` is read as `.`."}
                unitId: {type: integer}
                category: {$ref: "#/components/schemas/IngredientCategory"}
                clientId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: >-
                    A key the client makes up for this add (e.g. a UUID). An add with a key already
                    applied to this list is not applied again: the earlier result comes back (a retry
                    whose answer was lost, the app's offline queue). Without it every add counts.
      responses:
        "200":
          description: The item (for a repeated `clientId`, the earlier result).
          content:
            application/json:
              schema:
                type: object
                required: [id, merged, previousQuantity]
                properties:
                  id: {type: string}
                  merged: {type: boolean, description: "Added to an existing item."}
                  previousQuantity: {type: [string, "null"], description: "The existing item's quantity before (to undo)."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: The quantity is not more than 0.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/families/{familyId}/meals/shopping/check:
    post:
      tags: [Shopping]
      operationId: checkShoppingItems
      summary: Tick or untick items
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, checked]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {type: string}
                checked: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/CountResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/shopping/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - {name: itemId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Shopping]
      operationId: setShoppingItemQuantity
      summary: Change an item's quantity
      x-ohana-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: {type: string, minLength: 1, maxLength: 40}
      responses:
        "200":
          description: The item's new quantity.
          content:
            application/json:
              schema:
                type: object
                required: [id, quantity]
                properties:
                  id: {type: string}
                  quantity: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Shopping]
      operationId: deleteShoppingItem
      summary: Delete an item
      x-ohana-role: editor
      responses:
        "200": {$ref: "#/components/responses/DeletedString"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/families/{familyId}/meals/shopping/items/{itemId}/move:
    post:
      tags: [Shopping]
      operationId: moveShoppingItem
      summary: Move an item (or part of it) to another shopping list
      description: >-
        To any of the family's lists. With `quantity` below the item's, only that much moves and
        the rest stays; absent or equal, the whole item. What moves unticked (a part always does)
        is added to an unticked item of the same ingredient and unit on the target list
        (`merged`); otherwise the item itself moves (keeping its tick) or a new unticked item is
        made with the part. Undo by calling it back: not merged and whole, move `id` to
        `fromListId`; merged, move `quantity` of `id` to `fromListId`.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - {name: itemId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listId]
              properties:
                listId: {type: string, minLength: 1, maxLength: 64}
                quantity: {type: [string, number], description: "How much to move: more than 0, at most the item's quantity; `,` is read as `.`."}
      responses:
        "200":
          description: Where it went.
          content:
            application/json:
              schema:
                type: object
                required: [id, merged, previousQuantity, fromListId, quantity]
                properties:
                  id: {type: string, description: "The moved or new item, or the item it was added to."}
                  merged: {type: boolean, description: "Added to an existing item."}
                  previousQuantity: {type: [string, "null"], description: "The existing item's quantity before."}
                  fromListId: {type: string, description: "The list it came from."}
                  quantity: {type: string, description: "How much moved."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: The item is already on that list, or the quantity is not more than 0 or more than the item has.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  # ------------------------------------------------------------------ meals: separate routes ({message} errors)
  /api/v1/families/{familyId}/recipes:
    get:
      tags: [Meals]
      operationId: listRecipesLegacy
      summary: A page of recipes (separate route, `{message}` errors)
      description: Same as `GET …/meals/recipes`; `locale` is passed through to the name ordering.
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RecipeList"
        - $ref: "#/components/parameters/RecipeQuery"
        - $ref: "#/components/parameters/RecipeSort"
        - name: locale
          in: query
          schema: {type: string, default: en}
        - $ref: "#/components/parameters/RecipeTags"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RecipeLimit"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecipeList"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "404": {$ref: "#/components/responses/MessageNotFound"}
  /api/v1/families/{familyId}/recipes/{recipeId}:
    get:
      tags: [Meals]
      operationId: getRecipeLegacy
      summary: A recipe with all shared ingredients and units (separate route, `{message}` errors)
      x-ohana-role: viewer
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/RecipeId"
      responses:
        "200": {$ref: "#/components/responses/RecipeWithNames"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "404": {$ref: "#/components/responses/MessageNotFound"}
  /api/v1/families/{familyId}/recipes/generate:
    post:
      tags: [Meals]
      operationId: generateRecipes
      summary: Generate recipes with the family's AI (NDJSON stream)
      description: |
        Nothing is saved: show the recipes and save the picked ones with
        `POST …/meals/recipes/bulk`. The answer is `application/x-ndjson`, one JSON object per
        line (see `GenerationEvent`):

        * `{"type":"recipe","index":0,"data":{…}}` — each recipe as soon as the model answered
          (`data` is a `GeneratedRecipe`, snake_case);
        * `{"type":"image","index":0,"data":{"image_base64":"…"}}` — its photo (WebP), when an
          image model is set and `generateImages` is true;
        * `{"type":"image_error","message":"…"}` — the first photo failed (once);
        * `{"type":"error","message":"…"}` — the generation failed;
        * `{"type":"done"}` — always last.

        Closing the connection cancels the generation. Errors before the stream starts are
        JSON `{message}` (400 when the AI isn't set up, 404 when the `meals` or `assistant`
        module is off).
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: {type: integer, minimum: 1, maximum: 20, default: 10}
                tagIds:
                  type: array
                  items: {type: string}
                  default: []
                freeText: {type: string, maxLength: 2000, default: ""}
                generateImages: {type: boolean, default: true}
      responses:
        "200":
          description: The NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited `GenerationEvent` objects.
              x-ohana-item-schema: {$ref: "#/components/schemas/GenerationEvent"}
        "400": {$ref: "#/components/responses/MessageBadRequest"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "403": {$ref: "#/components/responses/MessageForbidden"}
        "404": {$ref: "#/components/responses/MessageNotFound"}
  /api/v1/families/{familyId}/shopping/toggle:
    post:
      tags: [Shopping]
      operationId: shoppingToggle
      summary: Tick, untick or flip shopping items (offline-queue replays)
      description: >-
        `set` is idempotent (what the app and its offline queue send); `toggle` flips one item;
        `uncheck-all` unticks several. Separate route, `{message}` errors.
      x-ohana-role: editor
      parameters:
        - $ref: "#/components/parameters/FamilyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, itemId, checked]
                  properties:
                    kind: {type: string, const: set}
                    itemId: {type: string, minLength: 1}
                    checked: {type: boolean}
                - type: object
                  required: [kind, itemId]
                  properties:
                    kind: {type: string, const: toggle}
                    itemId: {type: string, minLength: 1}
                - type: object
                  required: [kind, itemIds]
                  properties:
                    kind: {type: string, const: uncheck-all}
                    itemIds:
                      type: array
                      items: {type: string, minLength: 1}
      responses:
        "200":
          description: "`{checked}` for set/toggle, `{count}` for uncheck-all."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [checked]
                    properties:
                      checked: {type: boolean}
                  - type: object
                    required: [count]
                    properties:
                      count: {type: integer}
        "400": {$ref: "#/components/responses/MessageBadRequest"}
        "401": {$ref: "#/components/responses/MessageUnauthorized"}
        "403": {$ref: "#/components/responses/MessageForbidden"}
        "404": {$ref: "#/components/responses/MessageNotFound"}

