name: Relay

# The push relay (relay/) and its image: typecheck and tests on every pull request. Every push
# to main that passes them publishes the linux/amd64 + linux/arm64 image to GHCR
# (ghcr.io/<owner>/ohana-relay) as
#   :latest   the newest state of main
#   :main     the same (fa-krug's relay runs it)
#   :sha-<7>  that exact commit, for pinning or going back
# No deploy job: the Arcane project `ohana-relay` (relay/docker-compose.production.yml) is
# redeployed by hand for now. Forks build and test, and push to their own GHCR.
on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  pull_request:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ohana-relay
  PUSH: ${{ github.event_name == 'push' }}
  TAGS: |
    type=raw,value=latest,enable={{is_default_branch}}
    type=ref,event=branch
    type=sha

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relay/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Run tests
        run: npm run test

  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: [test]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-linux-amd64
          tags: ${{ env.TAGS }}
      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          file: ./relay/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay-amd64
          # ignore-error keeps a transient GHA cache 504 from failing an already-pushed image;
          # mode=min shrinks the export (final-stage layers only).
          cache-to: type=gha,mode=min,ignore-error=true,scope=relay-amd64
          platforms: linux/amd64
          provenance: false

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: [test]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-linux-arm64
          tags: ${{ env.TAGS }}
      - name: Build and push ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          file: ./relay/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay-arm64
          # ignore-error keeps a transient GHA cache 504 from failing an already-pushed image;
          # mode=min shrinks the export (final-stage layers only).
          cache-to: type=gha,mode=min,ignore-error=true,scope=relay-arm64
          platforms: linux/arm64
          provenance: false

  publish-manifest:
    name: Publish Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAGS }}
      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            docker buildx imagetools create -t "$tag" "$tag-linux-amd64" "$tag-linux-arm64"
          done
