name: Apple app

# The native app in apple/. Automatically only the cheap check: the String Catalog is in step with
# the German translations (Linux, seconds). The macOS unit tests and the iOS build run on a macOS
# runner, ten times the price of Linux, so only when started by hand (Actions → Apple app → Run
# workflow); run them in Xcode before pushing. Only the server deploys (ci.yml); the app is
# released by Xcode Cloud (apple/README.md, Releasing).
on:
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple.yml']
  pull_request:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple.yml']
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strings:
    name: Strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catalog up to date with the translations
        run: python3 apple/scripts/merge-localizations.py --check

  test:
    name: Build & Test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Unit tests (macOS)
        run: |
          # The whole log goes to a file; on failure the compiler errors are shown first.
          mkdir -p build
          xcodebuild test -scheme Ohana-macOS -destination 'platform=macOS' \
            -derivedDataPath build/dd-mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            > build/test-mac.log 2>&1 \
            || { grep -E -A4 ': (error|fatal error):' build/test-mac.log | head -n 150; tail -n 100 build/test-mac.log; exit 1; }
          tail -n 30 build/test-mac.log
      - name: Build (iOS)
        run: |
          xcodebuild build -scheme Ohana -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-ios CODE_SIGNING_ALLOWED=NO \
            > build/build-ios.log 2>&1 \
            || { grep -E -A4 ': (error|fatal error):' build/build-ios.log | head -n 150; tail -n 50 build/build-ios.log; exit 1; }
          tail -n 5 build/build-ios.log
      - name: German strings complete and catalog up to date
        run: python3 scripts/merge-localizations.py --check build/dd-ios
