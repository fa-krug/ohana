name: CI/CD

# The server (server/) and its image: tests on every pull request. Every push to main that passes
# them is a release: the linux/amd64 + linux/arm64 image goes to GHCR (ghcr.io/<owner>/ohana) as
#   :latest   the newest state of main (what self-hosters run; `docker compose pull` updates)
#   :main     the same (fa-krug's own server runs it)
#   :sha-<7>  that exact commit, for pinning or going back
# No release tags to make by hand. Then fa-krug's own server (Arcane) redeploys. Forks build
# and test, push to their own GHCR, and never deploy. Changes to the native app (apple/, its own
# workflow) or docs alone don't build images.
on:
  push:
    branches: [main]
    paths: ['server/**', 'docker-compose*.yml', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['server/**', 'docker-compose*.yml', '.github/workflows/ci.yml']

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ohana
  PUSH: ${{ github.event_name == 'push' }}
  TAGS: |
    type=raw,value=latest,enable={{is_default_branch}}
    type=ref,event=branch
    type=sha

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Build the pages' script
        run: npm run build
      - name: Run tests
        run: npm run test

  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: [test]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: version
        run: |
          # Shown by GET /api/v1/server: package.json's version and the commit, e.g. 0.2.0+56275e0.
          echo "version=$(node -p "require('./server/package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-linux-amd64
          tags: ${{ env.TAGS }}
      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OHANA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=amd64
          # ignore-error keeps a transient GHA cache 504 from failing an already-pushed image;
          # mode=min shrinks the export (final-stage layers only).
          cache-to: type=gha,mode=min,ignore-error=true,scope=amd64
          platforms: linux/amd64
          provenance: false

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: [test]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: version
        run: |
          # Shown by GET /api/v1/server: package.json's version and the commit, e.g. 0.2.0+56275e0.
          echo "version=$(node -p "require('./server/package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-linux-arm64
          tags: ${{ env.TAGS }}
      - name: Build and push ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OHANA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=arm64
          # ignore-error keeps a transient GHA cache 504 from failing an already-pushed image;
          # mode=min shrinks the export (final-stage layers only).
          cache-to: type=gha,mode=min,ignore-error=true,scope=arm64
          platforms: linux/arm64
          provenance: false

  publish-manifest:
    name: Publish Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAGS }}
      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            docker buildx imagetools create -t "$tag" "$tag-linux-amd64" "$tag-linux-arm64"
          done

  deploy:
    name: Deploy to Arcane
    runs-on: ubuntu-latest
    needs: [publish-manifest]
    # Only fa-krug's own server, only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'fa-krug/ohana'
    # id-token: write lets the CLI swap this run's GitHub OIDC token for a
    # short-lived Arcane token (federated credential, Deployer role), so no
    # deploy secret is stored in the repo.
    permissions: { contents: read, id-token: write }
    steps:
      - uses: getarcaneapp/setup-cli@v1
        with:
          version: 2.17.1
      - name: Redeploy Arcane project
        env:
          ARCANE_URL: https://arcane.fa-krug.de
          # The Arcane project `ohana` by its ID: its name also matches `ohana-relay` (the push
          # relay's project), and arcane-cli refuses an ambiguous name.
          PROJECT: 551344d3-cdc5-4ba9-a597-676a8c95d6b2
        run: |
          set -euo pipefail
          arcane-cli config set server-url "$ARCANE_URL"
          # </dev/null: the runner's stdin is a non-TTY, which makes the CLI try to
          # read a token from stdin instead of minting the GitHub OIDC token.
          eval "$(arcane-cli auth federated --audience "$ARCANE_URL" --export </dev/null)"
          echo "::add-mask::$ARCANE_TOKEN"
          # Pulls the new image and recreates the containers, streaming progress;
          # exits non-zero if the redeploy fails.
          arcane-cli projects redeploy "$PROJECT"
          arcane-cli projects get "$PROJECT"
      - name: Wait for the new version
        # /api/health alone would also pass on the old containers: wait until the server reports
        # this commit (GET /api/v1/server → version "<package version>+<commit>").
        run: |
          want="+${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            got="$(curl -fsS --max-time 10 https://ohana-app.fa-krug.de/api/v1/server | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "${got%"$want"}" != "$got" ]; then echo "Running $got"; exit 0; fi
            echo "Waiting: server reports '${got:-no version}', want …$want"
            sleep 10
          done
          echo "::error::https://ohana-app.fa-krug.de doesn't run $want after 5 minutes (does the Arcane project pull ghcr.io/fa-krug/ohana:main?)"
          exit 1
