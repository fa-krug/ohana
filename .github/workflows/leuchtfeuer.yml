# Generated by Leuchtfeuer onboarding: the tools run in their public images (one job per image); the
# last job runs the rest, uploads the reports and enforces the quality gate. Needs LEUCHTFEUER_URL
# and LEUCHTFEUER_TOKEN.
name: Leuchtfeuer
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: leuchtfeuer-${{ github.ref }}
  cancel-in-progress: true
env:
  LEUCHTFEUER_URL: ${{ vars.LEUCHTFEUER_URL || secrets.LEUCHTFEUER_URL }}
  LEUCHTFEUER_TOKEN: ${{ secrets.LEUCHTFEUER_TOKEN }}
  LF_REPORTS: .leuchtfeuer/reports
jobs:
  lf-test-test:
    name: 'Leuchtfeuer tests: Typecheck & Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: server/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: TypeScript check
      run: npm run typecheck
    - name: Build the pages' script
      run: npm run build
    - name: Run tests
      run: npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")" && npm run test -- --coverage.enabled --coverage.reporter=lcov
    - name: Collect the test reports for Leuchtfeuer
      if: always()
      shell: sh
      run: n=0; for f in $(find "$GITHUB_WORKSPACE/server" -name node_modules -prune -o -path "*/coverage/*" -name lcov.info -print 2>/dev/null); do n=$((n+1)); mkdir -p "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov" && cp "$f" "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov/js-1-$n.info"; done
    - name: Keep the test reports for Leuchtfeuer
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-test-test
        path: .leuchtfeuer/tests
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ohana
      TAGS: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=sha
      LF_TEST_ID: test
  lf-test-test-2:
    name: 'Leuchtfeuer tests: Typecheck & Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: relay/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: TypeScript check
      run: npm run typecheck
    - name: Run tests
      run: npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")" && npm run test -- --coverage.enabled --coverage.reporter=lcov
    - name: Collect the test reports for Leuchtfeuer
      if: always()
      shell: sh
      run: n=0; for f in $(find "$GITHUB_WORKSPACE/relay" -name node_modules -prune -o -path "*/coverage/*" -name lcov.info -print 2>/dev/null); do n=$((n+1)); mkdir -p "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov" && cp "$f" "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov/js-1-$n.info"; done
    - name: Keep the test reports for Leuchtfeuer
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-test-test-2
        path: .leuchtfeuer/tests
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ohana-relay
      TAGS: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=sha
      LF_TEST_ID: test-2
  lf-opengrep:
    name: 'Leuchtfeuer: Opengrep'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-opengrep@eff84201e66a-${{ github.run_id }}
        restore-keys: leuchtfeuer-opengrep@eff84201e66a-
    - name: Opengrep 1.33.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh buildpack-deps:trixie-curl -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          mkdir -p .leuchtfeuer/cache && export LF_OPENGREP_CACHE="$PWD/.leuchtfeuer/cache/opengrep"
          lf_og="${LF_OPENGREP_CACHE:-/tmp}/opengrep-1.33.1"; echo "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808  $lf_og" | sha256sum -c - >/dev/null 2>&1 || { mkdir -p "$(dirname "$lf_og")" && curl -fsSL -o "$lf_og" https://github.com/opengrep/opengrep/releases/download/v1.33.1/opengrep_manylinux_x86; }
          echo "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808  $lf_og" | sha256sum -c -
          install -m 0755 "$lf_og" /usr/local/bin/opengrep
          mkdir -p .leuchtfeuer/rules && curl -fsSL "$LEUCHTFEUER_URL/api/v1/downloads/rules/opengrep.tar.gz" | tar -xz -C .leuchtfeuer/rules
          opengrep scan --sarif --output "$LF_REPORTS/opengrep.sarif" --quiet --config .leuchtfeuer/rules/opengrep --exclude node_modules --exclude .leuchtfeuer --exclude vendor .
          { opengrep --version; } > "$LF_REPORTS/opengrep.version" 2>&1 || true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-opengrep@eff84201e66a-${{ github.run_id }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-opengrep
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-python:
    name: 'Leuchtfeuer: Bandit, mobsfscan, mypy, lizard'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-python@222d266184ef-${{ github.run_id }}
        restore-keys: leuchtfeuer-python@222d266184ef-
    - name: Bandit 1.9.4, mobsfscan 1.1.0, mypy 2.4.1, lizard 1.26.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh python:3.12-slim-trixie -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS" .leuchtfeuer/logs
          mkdir -p .leuchtfeuer/cache && export PIP_CACHE_DIR="$PWD/.leuchtfeuer/cache/pip"
          # Install for Bandit
          { pip install --quiet --disable-pip-version-check "bandit[sarif]==1.9.4"
          } || : > .leuchtfeuer/logs/bandit.failed
          # Install for mobsfscan
          { pip install --quiet --disable-pip-version-check mobsfscan==1.1.0
          } || : > .leuchtfeuer/logs/mobsfscan.failed
          # Install for mypy
          { pip install --quiet --disable-pip-version-check mypy==2.4.1
          } || : > .leuchtfeuer/logs/mypy.failed
          # Install for lizard
          { pip install --quiet --disable-pip-version-check lizard==1.26.0
          } || : > .leuchtfeuer/logs/lizard.failed
          lf_par="${LF_PARALLEL:-$(nproc 2>/dev/null || echo 2)}"; [ -n "${LF_PARALLEL:-}" ] || [ "$lf_par" -le 4 ] || lf_par=4; lf_n=0
          # Bandit 1.9.4
          if [ ! -f .leuchtfeuer/logs/bandit.failed ]; then
          ( { bandit -r . -f sarif -o "$LF_REPORTS/bandit.sarif" --exit-zero -x ./.venv,./node_modules,./.leuchtfeuer
          } || : > .leuchtfeuer/logs/bandit.failed
          { pip show bandit; } > "$LF_REPORTS/bandit.version" 2>&1 || true ) > .leuchtfeuer/logs/bandit.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          # mobsfscan 1.1.0
          if [ ! -f .leuchtfeuer/logs/mobsfscan.failed ]; then
          ( { [ -f .mobsf ] || printf '%s\n' 'ignore-paths: [Pods/, Carthage/, vendor/, node_modules/, .build/, .leuchtfeuer/]' > .mobsf
          } && { mobsfscan --type ios --sarif --no-fail -o "$LF_REPORTS/mobsfscan.sarif" .
          } || : > .leuchtfeuer/logs/mobsfscan.failed
          { pip show mobsfscan; } > "$LF_REPORTS/mobsfscan.version" 2>&1 || true ) > .leuchtfeuer/logs/mobsfscan.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          # mypy 2.4.1
          if [ ! -f .leuchtfeuer/logs/mypy.failed ]; then
          ( { mypy --output json --show-column-numbers --show-error-end --no-error-summary --no-pretty --ignore-missing-imports --exclude '(^|/)(\.venv|node_modules|\.leuchtfeuer)/' . > "$LF_REPORTS/mypy.json" || true
          } || : > .leuchtfeuer/logs/mypy.failed
          { pip show mypy; } > "$LF_REPORTS/mypy.version" 2>&1 || true ) > .leuchtfeuer/logs/mypy.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          # lizard 1.26.0
          if [ ! -f .leuchtfeuer/logs/lizard.failed ]; then
          ( { lizard --csv -x './node_modules/*' -x './.venv/*' -x './.leuchtfeuer/*' -x './Pods/*' -x './Carthage/*' . > "$LF_REPORTS/lizard.csv" || true
          } || : > .leuchtfeuer/logs/lizard.failed
          { pip show lizard; } > "$LF_REPORTS/lizard.version" 2>&1 || true ) > .leuchtfeuer/logs/lizard.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          wait; lf_failed=""; for lf_t in bandit mobsfscan mypy lizard; do
            if [ -f .leuchtfeuer/logs/$lf_t.log ]; then echo "== $lf_t"; cat .leuchtfeuer/logs/$lf_t.log; fi
            if [ -f .leuchtfeuer/logs/$lf_t.failed ]; then lf_failed="$lf_failed $lf_t"; fi
          done
          if [ -n "$lf_failed" ]; then echo "Failed steps:$lf_failed (the other reports were written)" >&2; exit 1; fi
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-python@222d266184ef-${{ github.run_id }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-python
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-ruff:
    name: 'Leuchtfeuer: Ruff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Ruff 0.17.5
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh ghcr.io/astral-sh/ruff:0.17.5-alpine -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          ruff check --output-format sarif --exit-zero --no-cache --output-file "$LF_REPORTS/ruff.sarif" .
          { ruff --version; } > "$LF_REPORTS/ruff.version" 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-ruff
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-node:
    name: 'Leuchtfeuer: ESLint, TypeScript (tsc --noEmit), jscpd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-node@07b389915891-${{ github.run_id }}
        restore-keys: leuchtfeuer-node@07b389915891-
    - name: ESLint 10.14.0, TypeScript (tsc --noEmit) 7.0.2, jscpd 5.4.3
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh node:24-alpine -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS" .leuchtfeuer/logs
          mkdir -p .leuchtfeuer/cache && export npm_config_cache="$PWD/.leuchtfeuer/cache/npm"
          # Install for ESLint, TypeScript (tsc --noEmit)
          { if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci --ignore-scripts --no-audit --no-fund; elif [ -f package.json ]; then npm install --ignore-scripts --no-audit --no-fund --no-package-lock; fi
          } || { : > .leuchtfeuer/logs/eslint.failed; : > .leuchtfeuer/logs/tsc.failed; }
          # Install for ESLint
          { npm install --no-save --no-audit --no-fund @microsoft/eslint-formatter-sarif@3.1.0
          } || : > .leuchtfeuer/logs/eslint.failed
          lf_par="${LF_PARALLEL:-$(nproc 2>/dev/null || echo 2)}"; [ -n "${LF_PARALLEL:-}" ] || [ "$lf_par" -le 4 ] || lf_par=4; lf_n=0
          # ESLint 10.14.0
          if [ ! -f .leuchtfeuer/logs/eslint.failed ]; then
          ( { npx eslint . -f @microsoft/eslint-formatter-sarif -o "$LF_REPORTS/eslint.sarif" || true
          } || : > .leuchtfeuer/logs/eslint.failed
          { npx eslint --version; } > "$LF_REPORTS/eslint.version" 2>&1 || true ) > .leuchtfeuer/logs/eslint.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          # TypeScript (tsc --noEmit) 7.0.2
          if [ ! -f .leuchtfeuer/logs/tsc.failed ]; then
          ( { npx tsc --noEmit --pretty false > "$LF_REPORTS/tsc.txt" || true
          } || : > .leuchtfeuer/logs/tsc.failed
          { npx tsc --version; } > "$LF_REPORTS/tsc.version" 2>&1 || true ) > .leuchtfeuer/logs/tsc.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          # jscpd 5.4.3
          if [ ! -f .leuchtfeuer/logs/jscpd.failed ]; then
          ( { npx --yes jscpd@5.4.3 --reporters json --output /tmp/jscpd --silent --ignore '**/node_modules/**,**/.leuchtfeuer/**' . || true
          } && { cp /tmp/jscpd/jscpd-report.json "$LF_REPORTS/jscpd.json" 2>/dev/null || true
          } || : > .leuchtfeuer/logs/jscpd.failed
          { npx --yes jscpd@5.4.3 --version; } > "$LF_REPORTS/jscpd.version" 2>&1 || true ) > .leuchtfeuer/logs/jscpd.log 2>&1 &
          lf_n=$((lf_n + 1)); [ "$lf_n" -lt "$lf_par" ] || { wait; lf_n=0; }
          fi
          wait; lf_failed=""; for lf_t in eslint tsc jscpd; do
            if [ -f .leuchtfeuer/logs/$lf_t.log ]; then echo "== $lf_t"; cat .leuchtfeuer/logs/$lf_t.log; fi
            if [ -f .leuchtfeuer/logs/$lf_t.failed ]; then lf_failed="$lf_failed $lf_t"; fi
          done
          if [ -n "$lf_failed" ]; then echo "Failed steps:$lf_failed (the other reports were written)" >&2; exit 1; fi
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-node@07b389915891-${{ github.run_id }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-node
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-swiftlint:
    name: 'Leuchtfeuer: SwiftLint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: SwiftLint 0.65.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh ghcr.io/realm/swiftlint:0.65.1 -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          [ -f .swiftlint.yml ] || printf '%s\n' 'excluded: [Pods, Carthage, vendor, node_modules, .build, .leuchtfeuer]' 'opt_in_rules: [accessibility_label_for_image, accessibility_trait_for_button, private_swiftui_state]' > .swiftlint.yml
          swiftlint lint --quiet --no-cache --force-exclude --reporter sarif --output "$LF_REPORTS/swiftlint.sarif" || [ $? -eq 2 ]
          { swiftlint version; } > "$LF_REPORTS/swiftlint.version" 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-swiftlint
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-grype:
    name: 'Leuchtfeuer: Grype'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-grype@76379226b9fd-${{ github.run_id }}
        restore-keys: leuchtfeuer-grype@76379226b9fd-
    - name: Grype 0.121.3
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh anchore/grype:v0.121.3-debug -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          mkdir -p .leuchtfeuer/cache && export GRYPE_DB_CACHE_DIR="$PWD/.leuchtfeuer/cache/grype"
          /grype dir:. -o sarif --file "$LF_REPORTS/grype.sarif" --exclude './.leuchtfeuer/**'
          { /grype version && /grype db status -o json; } > "$LF_REPORTS/grype.version" 2>&1 || true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      with:
        path: .leuchtfeuer/cache
        key: leuchtfeuer-grype@76379226b9fd-${{ github.run_id }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-grype
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-syft:
    name: 'Leuchtfeuer: Syft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Syft 1.57.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh anchore/syft:v1.57.1-debug -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          /syft scan dir:. -q -o cyclonedx-json="$LF_REPORTS/syft.cdx.json"
          { /syft version; } > "$LF_REPORTS/syft.version" 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-syft
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-checkov:
    name: 'Leuchtfeuer: Checkov'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Checkov 3.4.5
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh bridgecrew/checkov:3.4.5 -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          checkov -d . -o sarif --output-file-path /tmp/checkov --quiet --compact --soft-fail --skip-download --skip-path node_modules --skip-path .leuchtfeuer
          mv /tmp/checkov/results_sarif.sarif "$LF_REPORTS/checkov.sarif"
          { checkov --version; } > "$LF_REPORTS/checkov.version" 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-checkov
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-hadolint:
    name: 'Leuchtfeuer: Hadolint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Hadolint 2.14.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh hadolint/hadolint:v2.14.0-debian -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          find . -name 'Dockerfile*' -not -path '*/node_modules/*' -not -path './.leuchtfeuer/*' -exec hadolint -f sarif --no-fail {} + > "$LF_REPORTS/hadolint.sarif"
          { hadolint --version; } > "$LF_REPORTS/hadolint.version" 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-hadolint
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-shellcheck:
    name: 'Leuchtfeuer: ShellCheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ShellCheck 0.11.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh koalaman/shellcheck-alpine:v0.11.0 -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          find . -name '*.sh' -not -path '*/node_modules/*' -not -path './.leuchtfeuer/*' -exec shellcheck -f json1 {} + > "$LF_REPORTS/shellcheck.json" || true
          { shellcheck --version; } > "$LF_REPORTS/shellcheck.version" 2>&1 || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: lf-report-shellcheck
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  leuchtfeuer:
    name: 'Leuchtfeuer: upload and quality gate'
    runs-on: ubuntu-latest
    needs:
    - lf-opengrep
    - lf-python
    - lf-ruff
    - lf-node
    - lf-swiftlint
    - lf-grype
    - lf-syft
    - lf-checkov
    - lf-hadolint
    - lf-shellcheck
    - lf-test-test
    - lf-test-test-2
    if: always()
    timeout-minutes: 20
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: lf-report-*
        path: .leuchtfeuer/reports
        merge-multiple: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        pattern: lf-test-*
        path: .leuchtfeuer/tests
        merge-multiple: true
    - name: Upload to Leuchtfeuer and check the quality gate
      run: |-
        git config --global --add safe.directory "$PWD"
        mkdir -p .leuchtfeuer/bin .leuchtfeuer/reports
        lf_cli="${LEUCHTFEUER_URL%/}/api/v1/downloads/cli/linux/$(case "$(uname -m)" in aarch64|arm64) echo arm64;; *) echo amd64;; esac)"
        for i in 1 2 3 4 5; do wget -q -O .leuchtfeuer/bin/leuchtfeuer "$lf_cli" && break; if [ "$i" = 5 ]; then echo "Cannot download the Leuchtfeuer CLI from $lf_cli. Check LEUCHTFEUER_URL and that the server is up (GET ${LEUCHTFEUER_URL%/}/api/v1/downloads lists what it serves)." >&2; exit 1; fi; echo "CLI download failed, retrying in $((i * 10)) s" >&2; sleep $((i * 10)); done
        chmod 0755 .leuchtfeuer/bin/leuchtfeuer
        .leuchtfeuer/bin/leuchtfeuer run --reports-dir .leuchtfeuer/reports
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: leuchtfeuer
        path: |-
          .leuchtfeuer/*.sarif
          .leuchtfeuer/*.json
          .leuchtfeuer/*.txt
        if-no-files-found: ignore
