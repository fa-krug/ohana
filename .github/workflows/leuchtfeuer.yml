# Generated by Leuchtfeuer onboarding: every tool runs in its own public image; the last job
# uploads the reports and enforces the quality gate. Needs LEUCHTFEUER_URL and LEUCHTFEUER_TOKEN.
name: Leuchtfeuer
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: leuchtfeuer-${{ github.ref }}
  cancel-in-progress: true
env:
  LEUCHTFEUER_URL: ${{ vars.LEUCHTFEUER_URL || secrets.LEUCHTFEUER_URL }}
  LEUCHTFEUER_TOKEN: ${{ secrets.LEUCHTFEUER_TOKEN }}
  LF_REPORTS: .leuchtfeuer/reports
jobs:
  lf-test-test:
    name: 'Leuchtfeuer tests: Typecheck & Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: server/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: TypeScript check
      run: npm run typecheck
    - name: Build the pages' script
      run: npm run build
    - name: Run tests
      run: npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")" && npm run test -- --coverage.enabled --coverage.reporter=lcov
    - name: Collect the test reports for Leuchtfeuer
      if: always()
      shell: sh
      run: n=0; for f in $(find "$GITHUB_WORKSPACE/server" -name node_modules -prune -o -path "*/coverage/*" -name lcov.info -print 2>/dev/null); do n=$((n+1)); mkdir -p "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov" && cp "$f" "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov/js-1-$n.info"; done
    - name: Keep the test reports for Leuchtfeuer
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-test-test
        path: .leuchtfeuer/tests
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ohana
      TAGS: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=sha
      LF_TEST_ID: test
  lf-test-test-2:
    name: 'Leuchtfeuer tests: Typecheck & Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: relay/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: TypeScript check
      run: npm run typecheck
    - name: Run tests
      run: npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")" && npm run test -- --coverage.enabled --coverage.reporter=lcov
    - name: Collect the test reports for Leuchtfeuer
      if: always()
      shell: sh
      run: n=0; for f in $(find "$GITHUB_WORKSPACE/relay" -name node_modules -prune -o -path "*/coverage/*" -name lcov.info -print 2>/dev/null); do n=$((n+1)); mkdir -p "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov" && cp "$f" "$GITHUB_WORKSPACE/.leuchtfeuer/tests/$LF_TEST_ID/lcov/js-1-$n.info"; done
    - name: Keep the test reports for Leuchtfeuer
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-test-test-2
        path: .leuchtfeuer/tests
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ohana-relay
      TAGS: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=sha
      LF_TEST_ID: test-2
  lf-opengrep:
    name: 'Leuchtfeuer: Opengrep'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Opengrep 1.33.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh buildpack-deps:trixie-curl -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          curl -fsSL -o /usr/local/bin/opengrep https://github.com/opengrep/opengrep/releases/download/v1.33.1/opengrep_manylinux_x86
          echo "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808  /usr/local/bin/opengrep" | sha256sum -c -
          chmod 0755 /usr/local/bin/opengrep
          mkdir -p .leuchtfeuer/rules && curl -fsSL "$LEUCHTFEUER_URL/api/v1/downloads/rules/opengrep.tar.gz" | tar -xz -C .leuchtfeuer/rules
          opengrep scan --sarif --output "$LF_REPORTS/opengrep.sarif" --quiet --config .leuchtfeuer/rules/opengrep --exclude node_modules --exclude .leuchtfeuer --exclude vendor .
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-opengrep
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-bandit:
    name: 'Leuchtfeuer: Bandit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Bandit 1.9.4
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh python:3.12-slim-trixie -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          pip install --quiet --disable-pip-version-check "bandit[sarif]==1.9.4"
          bandit -r . -f sarif -o "$LF_REPORTS/bandit.sarif" --exit-zero -x ./.venv,./node_modules,./.leuchtfeuer
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-bandit
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-mobsfscan:
    name: 'Leuchtfeuer: mobsfscan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: mobsfscan 1.1.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh python:3.12-slim-trixie -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          pip install --quiet --disable-pip-version-check mobsfscan==1.1.0
          [ -f .mobsf ] || printf '%s\n' 'ignore-paths: [Pods/, Carthage/, vendor/, node_modules/, .build/, .leuchtfeuer/]' > .mobsf
          mobsfscan --type ios --sarif --no-fail -o "$LF_REPORTS/mobsfscan.sarif" .
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-mobsfscan
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-ruff:
    name: 'Leuchtfeuer: Ruff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Ruff 0.17.5
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh ghcr.io/astral-sh/ruff:0.17.5-alpine -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          ruff check --output-format sarif --exit-zero --no-cache --output-file "$LF_REPORTS/ruff.sarif" .
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-ruff
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-eslint:
    name: 'Leuchtfeuer: ESLint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: ESLint 10.14.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh node:24-alpine -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci --ignore-scripts --no-audit --no-fund; elif [ -f package.json ]; then npm install --ignore-scripts --no-audit --no-fund --no-package-lock; fi
          npm install --no-save --no-audit --no-fund @microsoft/eslint-formatter-sarif@3.1.0
          npx eslint . -f @microsoft/eslint-formatter-sarif -o "$LF_REPORTS/eslint.sarif" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-eslint
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-swiftlint:
    name: 'Leuchtfeuer: SwiftLint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: SwiftLint 0.65.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh ghcr.io/realm/swiftlint:0.65.1 -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          [ -f .swiftlint.yml ] || printf '%s\n' 'excluded: [Pods, Carthage, vendor, node_modules, .build, .leuchtfeuer]' 'opt_in_rules: [accessibility_label_for_image, accessibility_trait_for_button, private_swiftui_state]' > .swiftlint.yml
          swiftlint lint --quiet --no-cache --force-exclude --reporter sarif --output "$LF_REPORTS/swiftlint.sarif" || [ $? -eq 2 ]
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-swiftlint
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-mypy:
    name: 'Leuchtfeuer: mypy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: mypy 2.4.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh python:3.12-slim-trixie -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          pip install --quiet --disable-pip-version-check mypy==2.4.1
          mypy --output json --show-column-numbers --show-error-end --no-error-summary --no-pretty --ignore-missing-imports --exclude '(^|/)(\.venv|node_modules|\.leuchtfeuer)/' . > "$LF_REPORTS/mypy.json" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-mypy
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-tsc:
    name: 'Leuchtfeuer: TypeScript (tsc --noEmit)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: TypeScript (tsc --noEmit) 7.0.2
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh node:24-alpine -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci --ignore-scripts --no-audit --no-fund; elif [ -f package.json ]; then npm install --ignore-scripts --no-audit --no-fund --no-package-lock; fi
          npx tsc --noEmit --pretty false > "$LF_REPORTS/tsc.txt" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-tsc
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-grype:
    name: 'Leuchtfeuer: Grype'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Grype 0.121.3
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh anchore/grype:v0.121.3-debug -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          /grype dir:. -o sarif --file "$LF_REPORTS/grype.sarif"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-grype
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-syft:
    name: 'Leuchtfeuer: Syft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Syft 1.57.1
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh anchore/syft:v1.57.1-debug -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          /syft scan dir:. -q -o cyclonedx-json="$LF_REPORTS/syft.cdx.json"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-syft
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-checkov:
    name: 'Leuchtfeuer: Checkov'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Checkov 3.4.5
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh bridgecrew/checkov:3.4.5 -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          checkov -d . -o sarif --output-file-path /tmp/checkov --quiet --compact --soft-fail --skip-download --skip-path node_modules --skip-path .leuchtfeuer
          mv /tmp/checkov/results_sarif.sarif "$LF_REPORTS/checkov.sarif"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-checkov
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-hadolint:
    name: 'Leuchtfeuer: Hadolint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Hadolint 2.14.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh hadolint/hadolint:v2.14.0-debian -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          find . -name 'Dockerfile*' -not -path '*/node_modules/*' -not -path './.leuchtfeuer/*' -exec hadolint -f sarif --no-fail {} + > "$LF_REPORTS/hadolint.sarif"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-hadolint
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-shellcheck:
    name: 'Leuchtfeuer: ShellCheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: ShellCheck 0.11.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh koalaman/shellcheck-alpine:v0.11.0 -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          find . -name '*.sh' -not -path '*/node_modules/*' -not -path './.leuchtfeuer/*' -exec shellcheck -f json1 {} + > "$LF_REPORTS/shellcheck.json" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-shellcheck
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-lizard:
    name: 'Leuchtfeuer: lizard'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: lizard 1.26.0
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh python:3.12-slim-trixie -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          pip install --quiet --disable-pip-version-check lizard==1.26.0
          lizard --csv -x './node_modules/*' -x './.venv/*' -x './.leuchtfeuer/*' -x './Pods/*' -x './Carthage/*' . > "$LF_REPORTS/lizard.csv" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-lizard
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  lf-jscpd:
    name: 'Leuchtfeuer: jscpd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: jscpd 5.4.3
      run: docker run --rm -v "$PWD:$PWD" -w "$PWD" --user 0 -e LF_REPORTS -e LEUCHTFEUER_URL --entrypoint sh node:24-alpine -ec "$LF_SCRIPT"
      env:
        LF_SCRIPT: |-
          mkdir -p "$LF_REPORTS"
          npx --yes jscpd@5.4.3 --reporters json --output /tmp/jscpd --silent --ignore '**/node_modules/**,**/.leuchtfeuer/**' . || true
          cp /tmp/jscpd/jscpd-report.json "$LF_REPORTS/jscpd.json" 2>/dev/null || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lf-report-jscpd
        path: .leuchtfeuer/reports
        if-no-files-found: warn
        retention-days: 7
  leuchtfeuer:
    name: 'Leuchtfeuer: upload and quality gate'
    runs-on: ubuntu-latest
    needs:
    - lf-opengrep
    - lf-bandit
    - lf-mobsfscan
    - lf-ruff
    - lf-eslint
    - lf-swiftlint
    - lf-mypy
    - lf-tsc
    - lf-grype
    - lf-syft
    - lf-checkov
    - lf-hadolint
    - lf-shellcheck
    - lf-lizard
    - lf-jscpd
    - lf-test-test
    - lf-test-test-2
    if: always()
    timeout-minutes: 20
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        pattern: lf-report-*
        path: .leuchtfeuer/reports
        merge-multiple: true
    - uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: lf-test-*
        path: .leuchtfeuer/tests
        merge-multiple: true
    - name: Upload to Leuchtfeuer and check the quality gate
      run: |-
        git config --global --add safe.directory "$PWD"
        mkdir -p .leuchtfeuer/bin .leuchtfeuer/reports
        lf_cli="${LEUCHTFEUER_URL%/}/api/v1/downloads/cli/linux/$(case "$(uname -m)" in aarch64|arm64) echo arm64;; *) echo amd64;; esac)"
        for i in 1 2 3 4 5; do wget -q -O .leuchtfeuer/bin/leuchtfeuer "$lf_cli" && break; if [ "$i" = 5 ]; then echo "Cannot download the Leuchtfeuer CLI from $lf_cli. Check LEUCHTFEUER_URL and that the server is up (GET ${LEUCHTFEUER_URL%/}/api/v1/downloads lists what it serves)." >&2; exit 1; fi; echo "CLI download failed, retrying in $((i * 10)) s" >&2; sleep $((i * 10)); done
        chmod 0755 .leuchtfeuer/bin/leuchtfeuer
        .leuchtfeuer/bin/leuchtfeuer run --reports-dir .leuchtfeuer/reports
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: leuchtfeuer
        path: |-
          .leuchtfeuer/*.sarif
          .leuchtfeuer/*.json
          .leuchtfeuer/*.txt
        if-no-files-found: ignore
